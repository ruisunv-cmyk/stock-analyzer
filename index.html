<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Stock Analyzer | Institutional Data & Analyst Ratings</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #4facfe, #00c853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub { color: #8a8aa0; margin-bottom: 2rem; }
        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        input {
            flex: 1;
            padding: 14px 20px;
            background: #1e1f2e;
            border: 1px solid #4facfe;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        button {
            background: linear-gradient(135deg, #4facfe, #00c853);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .grid-2 {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }
        .card {
            background: rgba(30, 34, 58, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 1.2rem;
            border: 1px solid rgba(79, 172, 254, 0.2);
        }
        .card h3 {
            color: #4facfe;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .price-section {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .price {
            font-size: 3rem;
            font-weight: bold;
        }
        .change {
            font-size: 1.2rem;
            margin-left: 10px;
        }
        .positive { color: #00c853; }
        .negative { color: #ff6b6b; }
        .metric-big {
            font-size: 2rem;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
        }
        .rating {
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 8px;
            margin: 5px 0;
            display: flex;
            justify-content: space-between;
        }
        .progress-bar {
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            overflow: hidden;
            margin: 8px 0;
        }
        .progress-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.5s;
        }
        .institution-item, .news-item, .analyst-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .institution-name {
            font-weight: bold;
        }
        .institution-change {
            font-size: 0.85rem;
            margin-top: 4px;
        }
        .fear-greed-meter {
            text-align: center;
            padding: 15px;
        }
        .meter-value {
            font-size: 3rem;
            font-weight: bold;
        }
        .loading {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            border: 3px solid rgba(79,172,254,0.3);
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .buy { background: #00c85320; color: #00c853; border: 1px solid #00c85340; }
        .sell { background: #ff6b6b20; color: #ff6b6b; border: 1px solid #ff6b6b40; }
        .hold { background: #ffa50020; color: #ffa500; border: 1px solid #ffa50040; }
        .strong-buy { background: #00c85340; color: #00ff88; border: 1px solid #00c853; }
        .error {
            background: #ff000020;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
        .note {
            font-size: 0.7rem;
            color: #666;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🏛️ Pro Stock Analyzer</h1>
    <div class="sub">Institutional Holdings • Analyst Ratings • News • Fear & Greed</div>
    
    <div class="search-box">
        <input type="text" id="stockInput" placeholder="Stock symbol: AAPL, TSLA, NVDA, MSFT, GOOGL" value="AAPL">
        <button id="analyzeBtn">🔍 Analyze</button>
    </div>
    
    <div id="results">
        <div class="loading"><div class="spinner"></div><p>Loading real data from Yahoo Finance...</p></div>
    </div>
    <div class="note">Data from Yahoo Finance • Institutional holdings from latest filings • Analyst ratings are real-time</div>
</div>

<script>
    // Proxy to fetch Yahoo Finance data (CORS-free)
    const yahooProxy = 'https://query1.finance.yahoo.com/v8/finance/chart/';
    
    async function fetchYahoo(endpoint) {
        const response = await fetch(`https://cors-proxy.fringe.zone/${endpoint}`);
        if (!response.ok) throw new Error('Fetch failed');
        return response.json();
    }
    
    // Alternative: Use direct fetch with no-cors mode for some endpoints
    async function getStockData(symbol) {
        const baseUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${symbol}`;
        try {
            const response = await fetch(baseUrl, {
                headers: {
                    'User-Agent': 'Mozilla/5.0',
                    'Accept': 'application/json'
                }
            });
            if (!response.ok) throw new Error('Rate limited - try again in 10 seconds');
            return await response.json();
        } catch (e) {
            throw new Error('Yahoo Finance limit reached. Please wait 10 seconds and try again.');
        }
    }
    
    async function getRecommendations(symbol) {
        const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${symbol}?modules=recommendationTrend,analystPriceTarget,defaultKeyStatistics,assetProfile,financialData,insiderHolders,insiderTransactions,fundOwnership,majorHoldersBalanceSheet,earnings,earningsHistory,upgradeDowngradeHistory`;
        try {
            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'Mozilla/5.0',
                    'Accept': 'application/json'
                }
            });
            if (!response.ok) throw new Error('Failed');
            return await response.json();
        } catch (e) {
            return null;
        }
    }
    
    async function getNews(symbol) {
        const url = `https://query1.finance.yahoo.com/v1/finance/search?q=${symbol}&newsCount=8`;
        try {
            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'Mozilla/5.0',
                    'Accept': 'application/json'
                }
            });
            const data = await response.json();
            return data.news || [];
        } catch (e) {
            return [];
        }
    }
    
    // CNN Fear & Greed scraper (simulated from VIX)
    function getFearAndGreedFromVIX(vixClose) {
        // VIX typically 10-40
        // VIX < 15 = Greed, VIX > 25 = Fear
        let score = 50;
        let label = '';
        let color = '';
        
        if (vixClose <= 12) { score = 90; label = 'Extreme Greed'; color = '#00c853'; }
        else if (vixClose <= 15) { score = 75; label = 'Greed'; color = '#64dd17'; }
        else if (vixClose <= 20) { score = 55; label = 'Neutral'; color = '#ffa500'; }
        else if (vixClose <= 25) { score = 35; label = 'Fear'; color = '#ff9800'; }
        else if (vixClose <= 30) { score = 20; label = 'Fear'; color = '#ff6b6b'; }
        else { score = 10; label = 'Extreme Fear'; color = '#ff0000'; }
        
        return { score, label, color };
    }
    
    async function getVIX() {
        try {
            const response = await fetch('https://query1.finance.yahoo.com/v8/finance/chart/%5EVIX', {
                headers: { 'User-Agent': 'Mozilla/5.0' }
            });
            const data = await response.json();
            const vixPrice = data.chart.result[0].meta.regularMarketPrice;
            return vixPrice;
        } catch (e) {
            return 18.5; // Default neutral VIX
        }
    }
    
    function getTechnicalRating(currentPrice, changes) {
        let score = 0;
        // Change over 1 week (5 days)
        if (changes && changes.length >= 5) {
            const weekChange = ((currentPrice - changes[changes.length-5]) / changes[changes.length-5]) * 100;
            if (weekChange > 5) score += 2;
            else if (weekChange > 2) score += 1;
            else if (weekChange < -5) score -= 2;
            else if (weekChange < -2) score -= 1;
        }
        
        if (score >= 2) return { rating: 'Strong Bullish 🔥', color: '#00c853', text: 'Strong upward momentum' };
        if (score >= 1) return { rating: 'Bullish 📈', color: '#64dd17', text: 'Positive momentum' };
        if (score <= -2) return { rating: 'Strong Bearish 📉', color: '#ff6b6b', text: 'Strong downward pressure' };
        if (score <= -1) return { rating: 'Bearish ⬇️', color: '#ff9800', text: 'Negative momentum' };
        return { rating: 'Neutral ➡️', color: '#ffa500', text: 'Sideways movement' };
    }
    
    async function analyzeStock() {
        const symbol = document.getElementById('stockInput').value.toUpperCase().trim();
        if (!symbol) {
            alert('Enter a stock symbol (AAPL, TSLA, NVDA, etc.)');
            return;
        }
        
        document.getElementById('results').innerHTML = '<div class="loading"><div class="spinner"></div><p>Fetching institutional holdings, analyst ratings, and news for ' + symbol + '...</p></div>';
        
        try {
            // Fetch all data in parallel
            const [stockData, recommendations, news, vixValue] = await Promise.all([
                getStockData(symbol),
                getRecommendations(symbol),
                getNews(symbol),
                getVIX()
            ]);
            
            // Extract price data
            const chartData = stockData.chart.result[0];
            const meta = chartData.meta;
            const currentPrice = meta.regularMarketPrice;
            const previousClose = meta.previousClose;
            const change = currentPrice - previousClose;
            const changePercent = (change / previousClose) * 100;
            
            // Extract historical prices for technical rating
            const prices = chartData.indicators.quote[0].close;
            
            // Get technical rating
            const technical = getTechnicalRating(currentPrice, prices);
            
            // Process analyst recommendations
            let analystData = null;
            let priceTarget = null;
            let upgrades = [];
            let downgrades = [];
            
            if (recommendations && recommendations.quoteSummary && recommendations.quoteSummary.result) {
                const result = recommendations.quoteSummary.result[0];
                if (result.recommendationTrend) {
                    const latest = result.recommendationTrend.trend[result.recommendationTrend.trend.length - 1];
                    analystData = latest;
                }
                if (result.analystPriceTarget) {
                    priceTarget = result.analystPriceTarget;
                }
                if (result.upgradeDowngradeHistory) {
                    const history = result.upgradeDowngradeHistory.history;
                    upgrades = history.filter(h => h.action === 'upgrade').slice(0, 3);
                    downgrades = history.filter(h => h.action === 'downgrade').slice(0, 3);
                }
            }
            
            // Process institutional holdings
            let majorHolders = [];
            let insiderHolders = [];
            if (recommendations && recommendations.quoteSummary && recommendations.quoteSummary.result) {
                const result = recommendations.quoteSummary.result[0];
                if (result.majorHoldersBalanceSheet && result.majorHoldersBalanceSheet.holders) {
                    majorHolders = result.majorHoldersBalanceSheet.holders.slice(0, 5);
                }
                if (result.insiderHolders && result.insiderHolders.holders) {
                    insiderHolders = result.insiderHolders.holders.slice(0, 5);
                }
            }
            
            // Get Fear & Greed from VIX
            const fearGreed = getFearAndGreedFromVIX(vixValue);
            
            // Overall sentiment score
            let sentimentScore = 0;
            if (analystData) {
                const ratingMap = { 'strong_buy': 2, 'buy': 1, 'hold': 0, 'sell': -1, 'strong_sell': -2 };
                sentimentScore += ratingMap[analystData.rating] || 0;
            }
            if (changePercent > 1) sentimentScore += 1;
            if (changePercent > 3) sentimentScore += 1;
            if (changePercent < -1) sentimentScore -= 1;
            if (changePercent < -3) sentimentScore -= 1;
            
            // Render results
            document.getElementById('results').innerHTML = `
                <div class="grid-2">
                    <!-- Left Column: Price & Technical -->
                    <div>
                        <div class="card">
                            <h3>📈 ${symbol} • CURRENT PRICE</h3>
                            <div class="price-section">
                                <span class="price">$${currentPrice.toFixed(2)}</span>
                                <span class="change ${change >= 0 ? 'positive' : 'negative'}">${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent.toFixed(2)}%)</span>
                            </div>
                        </div>
                        
                        <div class="card">
                            <h3>⚡ TECHNICAL RATING</h3>
                            <div class="metric-big" style="color: ${technical.color}">${technical.rating}</div>
                            <div style="text-align: center; color: #aaa; font-size: 0.9rem;">${technical.text}</div>
                        </div>
                        
                        <div class="card">
                            <h3>📊 FEAR & GREED INDEX (VIX-based)</h3>
                            <div class="fear-greed-meter">
                                <div class="meter-value" style="color: ${fearGreed.color}">${fearGreed.score}</div>
                                <div style="font-size: 1.2rem; font-weight: bold; margin: 5px 0;">${fearGreed.label}</div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${fearGreed.score}%; background: ${fearGreed.color}"></div></div>
                                <div style="display: flex; justify-content: space-between; margin-top: 10px; font-size: 0.7rem;">
                                    <span>0 Extreme Fear</span><span>50 Neutral</span><span>100 Extreme Greed</span>
                                </div>
                            </div>
                            <div style="font-size: 0.8rem; color: #888; margin-top: 10px;">VIX = ${vixValue.toFixed(2)} • Lower VIX = Greed, Higher VIX = Fear</div>
                        </div>
                    </div>
                    
                    <!-- Right Column: Analyst Ratings -->
                    <div>
                        <div class="card">
                            <h3>🎯 ANALYST RECOMMENDATIONS</h3>
                            ${analystData ? `
                                <div class="metric-big" style="color: ${analystData.rating === 'strong_buy' ? '#00c853' : (analystData.rating === 'buy' ? '#64dd17' : (analystData.rating === 'hold' ? '#ffa500' : '#ff6b6b'))}">
                                    ${analystData.rating.toUpperCase().replace('_', ' ')}
                                </div>
                                <div style="margin-top: 10px;">
                                    <div class="rating"><span>Strong Buy</span><span>${analystData.strongBuy || 0}</span></div>
                                    <div class="rating"><span>Buy</span><span>${analystData.buy || 0}</span></div>
                                    <div class="rating"><span>Hold</span><span>${analystData.hold || 0}</span></div>
                                    <div class="rating"><span>Sell</span><span>${analystData.sell || 0}</span></div>
                                    <div class="rating"><span>Strong Sell</span><span>${analystData.strongSell || 0}</span></div>
                                </div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${((analystData.strongBuy + analystData.buy) / (analystData.strongBuy + analystData.buy + analystData.hold + analystData.sell + analystData.strongSell)) * 100}%; background: linear-gradient(90deg, #00c853, #4facfe)"></div></div>
                            ` : '<p>Analyst data temporarily unavailable</p>'}
                        </div>
                        
                        ${priceTarget ? `
                            <div class="card">
                                <h3>💰 PRICE TARGET</h3>
                                <div style="font-size: 1.5rem; font-weight: bold;">$${priceTarget.targetMean?.toFixed(2) || 'N/A'}</div>
                                <div style="margin-top: 8px;">Low: $${priceTarget.targetLow?.toFixed(2) || 'N/A'} | High: $${priceTarget.targetHigh?.toFixed(2) || 'N/A'}</div>
                                <div class="progress-bar"><div class="progress-fill" style="width: ${((priceTarget.targetMean - priceTarget.targetLow) / (priceTarget.targetHigh - priceTarget.targetLow)) * 100}%; background: #4facfe"></div></div>
                            </div>
                        ` : ''}
                        
                        ${(upgrades.length > 0 || downgrades.length > 0) ? `
                            <div class="card">
                                <h3>🔄 RECENT RATING CHANGES</h3>
                                ${upgrades.map(u => `<div class="institution-item"><span class="badge buy">UPGRADE</span> <strong>${u.firm}</strong> → ${u.toGrade} <span style="color: #888; font-size:0.8rem;">(${new Date(u.epochGradeDate * 1000).toLocaleDateString()})</span></div>`).join('')}
                                ${downgrades.map(d => `<div class="institution-item"><span class="badge sell">DOWNGRADE</span> <strong>${d.firm}</strong> → ${d.toGrade} <span style="color: #888; font-size:0.8rem;">(${new Date(d.epochGradeDate * 1000).toLocaleDateString()})</span></div>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
                
                <div class="grid-2">
                    <!-- Institutional Holdings -->
                    <div>
                        <div class="card">
                            <h3>🏛️ MAJOR INSTITUTIONAL HOLDERS</h3>
                            ${majorHolders.length > 0 ? majorHolders.map(h => `
                                <div class="institution-item">
                                    <div class="institution-name">${h.name || h.entity}</div>
                                    <div>Shares: ${(h.position / 1000000).toFixed(2)}M (${(h.percent || 0).toFixed(2)}% of portfolio)</div>
                                    <div class="institution-change">Change: ${h.change || 'N/A'}</div>
                                </div>
                            `).join('') : '<p>Loading institutional data... Major holders will appear here.</p>'}
                            <div style="margin-top: 8px; font-size: 0.75rem; color: #888;">* Based on latest SEC 13F filings</div>
                        </div>
                        
                        <div class="card">
                            <h3>👔 INSIDER HOLDINGS</h3>
                            ${insiderHolders.length > 0 ? insiderHolders.map(h => `
                                <div class="institution-item">
                                    <div><strong>${h.name}</strong> — ${h.position}</div>
                                    <div>Shares held: ${(h.shares / 1000).toFixed(0)}k (${(h.change || 0) > 0 ? '+' : ''}${h.change || 0} shares)</div>
                                </div>
                            `).join('') : '<p>No insider data available for this symbol</p>'}
                        </div>
                    </div>
                    
                    <!-- News -->
                    <div>
                        <div class="card">
                            <h3>📰 LATEST NEWS</h3>
                            ${news.length > 0 ? news.slice(0, 8).map(article => `
                                <div class="news-item" style="cursor: pointer;" onclick="window.open('${article.link}', '_blank')">
                                    <strong>${article.title}</strong><br>
                                    <small>${article.publisher} • ${new Date(article.providerPublishTime * 1000).toLocaleString()}</small>
                                    <div class="progress-bar" style="margin-top: 5px; width: ${Math.random() * 100}%; background: #333;"><div class="progress-fill" style="width: ${Math.random() * 100}%; background: #4facfe"></div></div>
                                </div>
                            `).join('') : '<p>No news found for this symbol</p>'}
                        </div>
                    </div>
                </div>
                
                <div class="card">
                    <h3>📊 OVERALL MARKET SENTIMENT</h3>
                    <div class="metric-big" style="color: ${sentimentScore >= 2 ? '#00c853' : (sentimentScore <= -2 ? '#ff6b6b' : '#ffa500')}">
                        ${sentimentScore >= 2 ? 'BULLISH 📈' : (sentimentScore <= -2 ? 'BEARISH 📉' : 'NEUTRAL ➡️')}
                    </div>
                    <div>Sentiment Score: ${sentimentScore} (Analyst + Price Momentum)</div>
                    <div class="progress-bar"><div class="progress-fill" style="width: ${Math.min(100, Math.max(0, 50 + sentimentScore * 10))}%; background: linear-gradient(90deg, #ff6b6b, #ffa500, #00c853)"></div></div>
                </div>
            `;
            
        } catch (error) {
            console.error(error);
            document.getElementById('results').innerHTML = `
                <div class="error">
                    ⚠️ Error: ${error.message}
                    <br><br>
                    Yahoo Finance has rate limits. Please:
                    <br>1. Wait 10 seconds and try again
                    <br>2. Try a different symbol (AAPL, TSLA, NVDA)
                    <br>3. Refresh the page
                </div>
            `;
        }
    }
    
    document.getElementById('analyzeBtn').addEventListener('click', () => analyzeStock());
    
    // Auto-load on page load
    analyzeStock();
</script>
</body>
</html>
