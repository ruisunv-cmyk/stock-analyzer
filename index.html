<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audit Input</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, sans-serif;
      background: #f7f9fc;
      color: #1a1a2e;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,.08);
      width: 100%;
      max-width: 520px;
    }
    h1 { font-size: 1.4rem; margin-bottom: 1.5rem; color: #1d4ed8; }
    label { display: block; font-size: .875rem; font-weight: 600; margin: .9rem 0 .35rem; }
    input, select, textarea {
      width: 100%;
      padding: .65rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: .95rem;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: 2px solid #1d4ed8;
      border-color: transparent;
    }
    textarea { resize: vertical; min-height: 80px; }
    button {
      margin-top: 1.5rem;
      width: 100%;
      background: #1d4ed8;
      color: #fff;
      padding: .8rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1e40af; }
    #result {
      margin-top: 1.25rem;
      padding: .9rem;
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 8px;
      font-size: .9rem;
      white-space: pre-wrap;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>New Audit Entry</h1>

    <form id="audit-form">
      <label for="title">Audit Title</label>
      <input type="text" id="title" placeholder="e.g. Q1 Financial Audit" required />

      <label for="auditor">Auditor Name</label>
      <input type="text" id="auditor" placeholder="Full name" required />

      <label for="department">Department</label>
      <select id="department" required>
        <option value="">Select…</option>
        <option>Finance</option>
        <option>Operations</option>
        <option>IT</option>
        <option>HR</option>
        <option>Compliance</option>
      </select>

      <label for="date">Audit Date</label>
      <input type="date" id="date" required />

      <label for="status">Status</label>
      <select id="status" required>
        <option value="planned">Planned</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
      </select>

      <label for="notes">Notes</label>
      <textarea id="notes" placeholder="Optional description…"></textarea>

      <button type="submit">Save Audit</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    document.getElementById('audit-form').addEventListener('submit', function (e) {
      e.preventDefault();

      const entry = {
        title: document.getElementById('title').value.trim(),
        auditor: document.getElementById('auditor').value.trim(),
        department: document.getElementById('department').value,
        date: document.getElementById('date').value,
        status: document.getElementById('status').value,
        notes: document.getElementById('notes').value.trim(),
      };

      // Save to localStorage
      const saved = JSON.parse(localStorage.getItem('audits') || '[]');
      saved.push(entry);
      localStorage.setItem('audits', JSON.stringify(saved));

      // Show confirmation
      const result = document.getElementById('result');
      result.style.display = 'block';
      result.textContent = '✅ Audit saved:\n' + JSON.stringify(entry, null, 2);

      this.reset();
    });
  </script>

</body>
</html>
