<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Trend Analyzer | Free</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #4facfe, #00c853);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub { color: #8a8aa0; margin-bottom: 2rem; }
        .card {
            background: rgba(30, 34, 58, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(79, 172, 254, 0.2);
        }
        .search-box { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
        input {
            flex: 1;
            padding: 14px 20px;
            background: #1e1f2e;
            border: 1px solid #4facfe;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        input:focus { outline: none; border-color: #00c853; }
        button {
            background: linear-gradient(135deg, #4facfe, #00c853);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); opacity: 0.9; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric {
            background: rgba(0,0,0,0.4);
            padding: 1.2rem;
            border-radius: 16px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .metric-value { font-size: 1.8rem; font-weight: bold; }
        .metric-label { font-size: 0.75rem; color: #aaa; margin-top: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .positive { color: #00c853; }
        .negative { color: #ff6b6b; }
        .neutral { color: #ffa500; }
        .news-item {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 15px 0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .news-item:hover { background: rgba(79,172,254,0.1); padding-left: 10px; }
        .loading { text-align: center; padding: 60px; }
        .spinner {
            border: 3px solid rgba(79,172,254,0.3);
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .price { font-size: 2.5rem; font-weight: bold; display: inline-block; margin-right: 15px; }
        .change { font-size: 1.2rem; font-weight: 500; }
        .info-box {
            background: rgba(79,172,254,0.1);
            padding: 15px;
            border-radius: 12px;
            margin-top: 20px;
            text-align: center;
            font-size: 0.85rem;
        }
        .score-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.5s;
        }
        h3 { margin-bottom: 1rem; color: #4facfe; font-size: 1.1rem; }
        .recommendation {
            background: linear-gradient(135deg, #1e2240, #15192e);
            padding: 1.2rem;
            border-radius: 12px;
            margin-top: 1rem;
            text-align: center;
            font-size: 1.1rem;
            border-left: 4px solid #4facfe;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>📈 Stock Trend Analyzer</h1>
    <div class="sub">Market Data + News Sentiment + Fear & Greed Index</div>
    
    <div class="card">
        <div class="search-box">
            <input type="text" id="stockInput" placeholder="Enter stock symbol (AAPL, TSLA, NVDA, GOOGL, MSFT)" value="AAPL">
            <button id="analyzeBtn">🔍 Analyze Stock</button>
        </div>
        
        <div id="results">
            <div class="info-box">💡 Enter a stock symbol above. Try AAPL, TSLA, or NVDA to start!</div>
        </div>
    </div>
</div>

<script>
    // Popular stocks for suggestions
    const popularStocks = ['AAPL', 'TSLA', 'NVDA', 'GOOGL', 'MSFT', 'META', 'AMZN'];
    
    document.getElementById('analyzeBtn').addEventListener('click', async () => {
        const symbol = document.getElementById('stockInput').value.toUpperCase().trim();
        if(!symbol) { alert('Enter a stock symbol like AAPL or TSLA'); return; }
        
        document.getElementById('results').innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing ' + symbol + '...</p></div>';
        
        try {
            // Fetch stock data from free Alpha Vantage (demo key works for limited requests)
            const priceRes = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=demo`);
            const priceData = await priceRes.json();
            
            let currentPrice = 'N/A', change = 0, changePercent = 0;
            let hasData = false;
            
            if(priceData['Global Quote'] && priceData['Global Quote']['05. price']) {
                currentPrice = parseFloat(priceData['Global Quote']['05. price']).toFixed(2);
                change = parseFloat(priceData['Global Quote']['09. change']).toFixed(2);
                changePercent = parseFloat(priceData['Global Quote']['10. change percent'].replace('%','')).toFixed(2);
                hasData = true;
            }
            
            // Fetch news using free GNews API (no key required)
            let newsArticles = [];
            try {
                const newsRes = await fetch(`https://gnews.io/api/v4/search?q=${symbol}+stock&lang=en&max=6&country=us`);
                const newsData = await newsRes.json();
                newsArticles = newsData.articles || [];
            } catch(e) {
                console.log('News fetch limited');
            }
            
            // Calculate Fear & Greed based on price momentum
            let fearGreedScore = 50;
            if (changePercent > 3) fearGreedScore = 85;
            else if (changePercent > 1) fearGreedScore = 70;
            else if (changePercent < -3) fearGreedScore = 15;
            else if (changePercent < -1) fearGreedScore = 30;
            else if (Math.abs(changePercent) < 0.5) fearGreedScore = 50;
            
            let fearGreedLabel = fearGreedScore >= 70 ? '🟢 Extreme Greed' : (fearGreedScore >= 55 ? '🔵 Greed' : (fearGreedScore <= 30 ? '🔴 Extreme Fear' : (fearGreedScore <= 45 ? '🟡 Fear' : '⚪ Neutral')));
            
            // Market signal based on price action
            let marketSignal = '';
            let signalColor = '';
            if (changePercent > 2) { marketSignal = 'STRONG BULLISH ↑'; signalColor = '#00c853'; }
            else if (changePercent > 0.5) { marketSignal = 'BULLISH ↗'; signalColor = '#00c853'; }
            else if (changePercent < -2) { marketSignal = 'STRONG BEARISH ↓'; signalColor = '#ff6b6b'; }
            else if (changePercent < -0.5) { marketSignal = 'BEARISH ↘'; signalColor = '#ff6b6b'; }
            else { marketSignal = 'NEUTRAL →'; signalColor = '#ffa500'; }
            
            // News sentiment analysis (simple keyword matching)
            let sentimentScore = 0;
            const positiveWords = ['surge', 'rally', 'gain', 'bullish', 'upgrade', 'buy', 'positive', 'growth', 'record', 'high'];
            const negativeWords = ['drop', 'fall', 'bearish', 'downgrade', 'sell', 'negative', 'decline', 'crash', 'low', 'risk'];
            
            newsArticles.forEach(article => {
                const text = (article.title + ' ' + (article.description || '')).toLowerCase();
                positiveWords.forEach(w => { if(text.includes(w)) sentimentScore += 1; });
                negativeWords.forEach(w => { if(text.includes(w)) sentimentScore -= 1; });
            });
            
            let newsSentiment = sentimentScore > 2 ? 'Bullish 📈' : (sentimentScore < -2 ? 'Bearish 📉' : 'Neutral 📊');
            let newsColor = sentimentScore > 2 ? '#00c853' : (sentimentScore < -2 ? '#ff6b6b' : '#ffa500');
            
            // Generate trading recommendation
            let recommendation = '';
            let recommendationReason = '';
            let totalScore = 0;
            if (changePercent > 1) totalScore += 2;
            if (changePercent > 3) totalScore += 1;
            if (changePercent < -1) totalScore -= 2;
            if (changePercent < -3) totalScore -= 1;
            if (sentimentScore > 0) totalScore += 1;
            if (sentimentScore < 0) totalScore -= 1;
            if (fearGreedScore > 65) totalScore += 1;
            if (fearGreedScore < 35) totalScore -= 1;
            
            if (totalScore >= 3) {
                recommendation = 'BUY / ACCUMULATE';
                recommendationReason = 'Strong positive momentum, bullish sentiment, and favorable market conditions suggest upside potential.';
            } else if (totalScore >= 1) {
                recommendation = 'WATCH / CAUTIOUS BUY';
                recommendationReason = 'Moderate positive signals. Consider scaling in gradually or waiting for a better entry.';
            } else if (totalScore <= -3) {
                recommendation = 'SELL / AVOID';
                recommendationReason = 'Negative momentum, bearish sentiment, and weakness across indicators suggest downside risk.';
            } else if (totalScore <= -1) {
                recommendation = 'WAIT / HOLD';
                recommendationReason = 'Mixed signals. Better to stay on the sidelines until clearer direction emerges.';
            } else {
                recommendation = 'NEUTRAL / HOLD';
                recommendationReason = 'Balanced signals with no strong directional bias. Monitor for confirmation.';
            }
            
            // Build news HTML
            let newsHTML = '';
            if (newsArticles.length > 0) {
                newsHTML = '<h3>📰 Latest News & Headlines</h3>';
                newsArticles.forEach(article => {
                    newsHTML += `
                        <div class="news-item" onclick="window.open('${article.url}', '_blank')">
                            <strong>${article.title || 'News article'}</strong><br>
                            <small>${article.source?.name || 'News'} • ${new Date(article.publishedAt).toLocaleDateString()}</small>
                        </div>
                    `;
                });
            } else {
                newsHTML = '<div class="info-box">📰 News preview: Try searching for "Tesla stock news" to see headlines. Free API has daily limits.</div>';
            }
            
            // Display results
            document.getElementById('results').innerHTML = `
                ${hasData ? `
                    <div style="margin-bottom: 25px; text-align: center;">
                        <span class="price">$${currentPrice}</span>
                        <span class="change ${change >= 0 ? 'positive' : 'negative'}">${change >= 0 ? '+' : ''}${change} (${changePercent}%)</span>
                    </div>
                    
                    <div class="metrics">
                        <div class="metric">
                            <div class="metric-value" style="color: ${signalColor}">${marketSignal}</div>
                            <div class="metric-label">Market Signal</div>
                            <div class="score-bar"><div class="score-fill" style="width: ${Math.min(100, Math.max(0, 50 + parseFloat(changePercent) * 5))}%; background: ${signalColor}"></div></div>
                        </div>
                        <div class="metric">
                            <div class="metric-value" style="color: ${newsColor}">${newsSentiment}</div>
                            <div class="metric-label">News Sentiment (${newsArticles.length} articles)</div>
                        </div>
                        <div class="metric">
                            <div class="metric-value" style="color: ${fearGreedScore >= 70 ? '#ff9800' : (fearGreedScore <= 30 ? '#ff6b6b' : '#4facfe')}">${fearGreedLabel}</div>
                            <div class="metric-label">Fear & Greed Index</div>
                            <div class="score-bar"><div class="score-fill" style="width: ${fearGreedScore}%; background: ${fearGreedScore >= 70 ? '#ff9800' : (fearGreedScore <= 30 ? '#ff6b6b' : '#4facfe')}"></div></div>
                        </div>
                    </div>
                    
                    <div class="recommendation">
                        <h3>💡 AI-Powered Recommendation</h3>
                        <div style="font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: ${totalScore >= 1 ? '#00c853' : (totalScore <= -1 ? '#ff6b6b' : '#ffa500')}">${recommendation}</div>
                        <p style="color: #ccc;">${recommendationReason}</p>
                    </div>
                    
                    <div style="margin-top: 25px;">
                        ${newsHTML}
                    </div>
                    
                    <div class="info-box">
                        💡 <strong>How it works:</strong> This analyzer combines price momentum, news sentiment analysis, and market psychology (Fear & Greed) to generate trading signals. Green = Bullish signals, Red = Bearish signals.
                    </div>
                ` : `
                    <div class="info-box" style="background: #ff6b6b20;">
                        ⚠️ Could not find data for "${symbol}". Try a major stock like: AAPL, TSLA, NVDA, GOOGL, MSFT, META, AMZN
                    </div>
                `}
            `;
            
        } catch(error) {
            document.getElementById('results').innerHTML = `
                <div class="info-box" style="background: #ff6b6b20;">
                    ⚠️ Error fetching data. The free API has limits. Try again in 30 seconds, or try a different stock symbol like AAPL or TSLA.
                    <br><br>Details: ${error.message}
                </div>
            `;
        }
    });
    
    // Trigger initial analysis
    setTimeout(() => {
        document.getElementById('analyzeBtn').click();
    }, 100);
</script>
</body>
</html>
