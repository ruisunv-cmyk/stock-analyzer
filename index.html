<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我们的旅行地图 | 一起走过的路</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #f5f0e8 0%, #e8e4db 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #2c2a28;
            min-height: 100vh;
        }
        .header {
            background: rgba(254, 252, 248, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e8e4db;
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .logo {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #8b5e3c;
        }
        .logo i { margin-right: 6px; color: #c9a88b; }
        .nav-tabs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .nav-tab {
            padding: 6px 16px;
            border: none;
            background: transparent;
            font-weight: 500;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 0.5px;
            color: #6b6a64;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .nav-tab.active {
            background: #f0ede6;
            color: #8b5e3c;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }
        /* 世界地图容器 */
        .world-map {
            background: linear-gradient(135deg, #c8e0d0, #b8d0c0);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            position: relative;
            overflow-x: auto;
        }
        .map-title {
            text-align: center;
            margin-bottom: 15px;
            color: #5a7a5a;
            font-size: 14px;
            letter-spacing: 2px;
        }
        .map-svg-container {
            display: flex;
            justify-content: center;
            min-width: 800px;
        }
        svg {
            background: #d4e8d8;
            border-radius: 16px;
            cursor: pointer;
        }
        .country-label {
            font-size: 10px;
            fill: #5a6a5a;
            font-weight: 500;
        }
        .marker-point {
            cursor: pointer;
            transition: r 0.2s;
        }
        .marker-point:hover { r: 8; }
        .marker-together { fill: #4a9b6e; stroke: white; stroke-width: 2; }
        .marker-rui { fill: #5b8cc9; stroke: white; stroke-width: 2; }
        .marker-kalang { fill: #e8a34b; stroke: white; stroke-width: 2; }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: #fefcf8;
            padding: 16px;
            border-bottom: 2px solid #e8e4db;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 12px;
        }
        .stat-card:hover { transform: translateY(-2px); border-bottom-color: #8b5e3c; }
        .stat-icon { font-size: 24px; margin-bottom: 6px; }
        .stat-value { font-size: 28px; font-weight: 600; }
        .stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #9e9b92; margin-top: 4px; }
        .card {
            background: #fefcf8;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 16px;
            border-bottom: 1px solid #e8e4db;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .card-title { font-size: 18px; font-weight: 500; color: #3d3a34; }
        .btn-primary {
            background: transparent;
            color: #8b5e3c;
            border: 1px solid #d4cfc4;
            padding: 6px 18px;
            font-weight: 500;
            cursor: pointer;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 40px;
            transition: 0.25s;
        }
        .btn-primary:hover { background: #8b5e3c; color: #fefcf8; }
        .btn-secondary {
            background: transparent;
            color: #9e9b92;
            border: 1px solid #e0dcd2;
            padding: 5px 14px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 40px;
        }
        .btn-danger {
            background: transparent;
            color: #c9a88b;
            border: 1px solid #e8ddd2;
            padding: 5px 12px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 40px;
        }
        .btn-danger:hover { background: #c9a88b; color: white; }
        .btn-export {
            background: transparent;
            color: #4a9b6e;
            border: 1px solid #c8e0d0;
            padding: 5px 14px;
            cursor: pointer;
            font-size: 11px;
            border-radius: 40px;
        }
        .destination-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #f0ede6;
            cursor: pointer;
            transition: all 0.2s;
        }
        .destination-item:hover { background: #faf8f3; padding-left: 8px; }
        .destination-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 10px;
        }
        .badge-together { background: #4a9b6e; }
        .badge-rui { background: #5b8cc9; }
        .badge-kalang { background: #e8a34b; }
        .badge-dream { background: #d4af37; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(43, 42, 40, 0.9);
            backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal.active { display: flex; }
        .modal-content {
            background: #fefcf8;
            padding: 24px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 20px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: #9e9b92;
            text-transform: uppercase;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #e0dcd2;
            background: transparent;
            font-size: 13px;
            border-radius: 10px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #8b5e3c; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .photo-preview {
            width: 100%;
            height: 100px;
            background: #f0ede6;
            border-radius: 10px;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .filter-buttons { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-btn {
            padding: 5px 14px;
            border: 1px solid #e0dcd2;
            background: transparent;
            cursor: pointer;
            font-size: 11px;
            border-radius: 40px;
        }
        .filter-btn.active { background: #e8e4db; border-color: #c9b896; }
        @media (max-width: 900px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } .map-svg-container { min-width: 100%; overflow-x: scroll; } }
        .memory-text { font-size: 11px; color: #6b6a64; margin-top: 3px; }
        hr { margin: 12px 0; border: none; border-top: 1px solid #e8e4db; }
        .data-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
        .import-input { position: fixed; opacity: 0; pointer-events: none; width: 0; height: 0; }
        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .search-bar input {
            flex: 1;
            padding: 10px 16px;
            border: 1px solid #e0dcd2;
            border-radius: 40px;
            font-size: 13px;
        }
        .search-bar button {
            padding: 10px 20px;
            background: #8b5e3c;
            color: white;
            border: none;
            border-radius: 40px;
            cursor: pointer;
        }
        .city-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        .city-chip {
            background: #f0ede6;
            padding: 5px 14px;
            border-radius: 30px;
            font-size: 12px;
            cursor: pointer;
        }
        .city-chip:hover { background: #e0dcd2; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
<div class="header">
    <div class="header-content">
        <div class="logo"><i class="fas fa-heart"></i> 我们的旅行地图</div>
        <div class="nav-tabs">
            <button class="nav-tab active" data-page="map">🗺️ 地图</button>
            <button class="nav-tab" data-page="destinations">📍 目的地</button>
            <button class="nav-tab" data-page="bucketlist">⭐ 梦想</button>
            <button class="nav-tab" data-page="stats">📊 统计</button>
        </div>
    </div>
</div>

<div class="container">
    <!-- 地图页面 -->
    <div id="mapPage" class="page active">
        <div class="world-map">
            <div class="map-title"><i class="fas fa-map"></i> 点击地图上的点查看详情 | 点击下方城市快速添加</div>
            <div class="map-svg-container" id="mapSvgContainer">
                <svg width="900" height="450" viewBox="0 0 900 450" id="worldMapSvg">
                    <!-- 各大洲背景 -->
                    <rect width="900" height="450" fill="#d4e8d8" rx="12"/>
                    <!-- 亚洲区域 -->
                    <path d="M450,80 Q550,70 650,90 Q720,100 750,130 Q780,160 770,200 Q760,240 720,260 Q680,280 620,290 Q560,300 520,280 Q480,260 470,220 Q460,180 450,140 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    <!-- 欧洲区域 -->
                    <path d="M350,70 Q400,60 440,80 Q450,100 440,130 Q430,160 400,170 Q370,180 350,160 Q330,140 340,110 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    <!-- 非洲区域 -->
                    <path d="M380,200 Q420,190 450,210 Q460,240 450,280 Q440,310 420,320 Q400,330 390,300 Q380,270 380,240 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    <!-- 北美区域 -->
                    <path d="M120,100 Q180,80 220,110 Q250,140 240,180 Q230,220 200,240 Q170,250 150,230 Q130,200 120,160 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    <!-- 南美区域 -->
                    <path d="M220,280 Q260,270 280,300 Q290,340 280,380 Q270,400 250,410 Q230,400 220,370 Q210,340 220,310 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    <!-- 澳洲区域 -->
                    <path d="M720,320 Q760,310 790,330 Q810,360 790,380 Q760,390 740,370 Q720,350 720,330 Z" fill="#c8dec8" stroke="#a0bc9a" stroke-width="1" opacity="0.6"/>
                    
                    <!-- 各大洲文字 -->
                    <text x="580" y="180" class="country-label" opacity="0.5">亚洲</text>
                    <text x="380" y="130" class="country-label" opacity="0.5">欧洲</text>
                    <text x="150" y="180" class="country-label" opacity="0.5">北美洲</text>
                    <text x="240" y="350" class="country-label" opacity="0.5">南美洲</text>
                    <text x="750" y="360" class="country-label" opacity="0.5">大洋洲</text>
                    <text x="410" y="280" class="country-label" opacity="0.5">非洲</text>
                    
                    <!-- 标记点会动态添加到这里 -->
                    <g id="markersGroup"></g>
                </svg>
            </div>
        </div>
        
        <!-- 快速搜索添加 -->
        <div class="card">
            <div class="card-header"><div class="card-title"><i class="fas fa-search"></i> 快速添加城市</div></div>
            <div class="search-bar">
                <input type="text" id="citySearch" placeholder="输入城市名...">
                <button onclick="searchAndAddCity()"><i class="fas fa-plus"></i> 添加</button>
            </div>
            <div class="city-chips">
                <span class="city-chip" onclick="quickAddCity('北京', 65, 45)">📍 北京</span>
                <span class="city-chip" onclick="quickAddCity('上海', 68, 50)">📍 上海</span>
                <span class="city-chip" onclick="quickAddCity('巴黎', 35, 40)">📍 巴黎</span>
                <span class="city-chip" onclick="quickAddCity('东京', 78, 48)">📍 东京</span>
                <span class="city-chip" onclick="quickAddCity('罗马', 38, 41)">📍 罗马</span>
                <span class="city-chip" onclick="quickAddCity('纽约', 20, 42)">📍 纽约</span>
                <span class="city-chip" onclick="quickAddCity('伦敦', 32, 38)">📍 伦敦</span>
                <span class="city-chip" onclick="quickAddCity('曼谷', 62, 62)">📍 曼谷</span>
                <span class="city-chip" onclick="quickAddCity('悉尼', 82, 75)">📍 悉尼</span>
                <span class="city-chip" onclick="quickAddCity('圣托里尼', 40, 45)">📍 圣托里尼</span>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="stat-card" onclick="filterByType('together')"><div class="stat-icon">❤️</div><div class="stat-value" id="togetherCount">0</div><div class="stat-label">一起去过</div></div>
            <div class="stat-card" onclick="filterByType('rui')"><div class="stat-icon">👩</div><div class="stat-value" id="ruiCount">0</div><div class="stat-label">Rui去过</div></div>
            <div class="stat-card" onclick="filterByType('kalang')"><div class="stat-icon">👨</div><div class="stat-value" id="kalangCount">0</div><div class="stat-label">Kalang去过</div></div>
            <div class="stat-card" onclick="filterByType('dream')"><div class="stat-icon">✨</div><div class="stat-value" id="dreamCount">0</div><div class="stat-label">想去</div></div>
        </div>
        
        <div class="card">
            <div class="card-header"><div class="card-title">📌 最近添加</div><button class="btn-primary" onclick="openAddModal()"><i class="fas fa-plus"></i> 手动添加</button></div>
            <div id="featuredList"></div>
        </div>
    </div>

    <div id="destinationsPage" class="page">
        <div class="card">
            <div class="card-header"><div class="card-title">📍 所有目的地</div></div>
            <div class="filter-buttons" id="destinationFilters">
                <button class="filter-btn active" data-filter="all">全部</button>
                <button class="filter-btn" data-filter="together">一起去过 ❤️</button>
                <button class="filter-btn" data-filter="rui">Rui 👩</button>
                <button class="filter-btn" data-filter="kalang">Kalang 👨</button>
                <button class="filter-btn" data-filter="dream">梦想 ✨</button>
            </div>
            <div id="allDestinationsList"></div>
        </div>
    </div>

    <div id="bucketlistPage" class="page">
        <div class="card">
            <div class="card-header"><div class="card-title">⭐ 我们的梦想目的地</div><button class="btn-primary" onclick="openAddModalWithType('dream')"><i class="fas fa-plus"></i> 添加梦想</button></div>
            <div id="bucketListContainer"></div>
        </div>
    </div>

    <div id="statsPage" class="page">
        <div class="card">
            <div class="card-header"><div class="card-title">📊 旅行统计</div></div>
            <canvas id="travelChart" style="max-height: 260px; margin-bottom: 20px;"></canvas>
            <div id="statDetails"></div>
            <div class="data-buttons">
                <button class="btn-export" onclick="exportData()"><i class="fas fa-download"></i> 导出数据</button>
                <button class="btn-export" onclick="document.getElementById('importFile').click()"><i class="fas fa-upload"></i> 导入数据</button>
                <input type="file" id="importFile" class="import-input" accept=".json" onchange="importData(this)">
            </div>
            <p style="font-size: 10px; color: #9e9b92; text-align: center; margin-top: 12px;">💡 从电脑导出，在手机上导入即可同步</p>
        </div>
    </div>
</div>

<div id="destinationModal" class="modal">
    <div class="modal-content">
        <h3 id="modalTitle" style="margin-bottom: 16px; font-size: 22px;">添加目的地</h3>
        <div class="form-group"><label>📍 城市/地点</label><input type="text" id="destName" placeholder="例如: 北京, 上海, 巴黎"></div>
        <div class="form-group"><label>📍 地图X位置 (0-100)</label><input type="number" id="destX" placeholder="例如: 65" step="1" min="0" max="100"></div>
        <div class="form-group"><label>📍 地图Y位置 (0-100)</label><input type="number" id="destY" placeholder="例如: 45" step="1" min="0" max="100"></div>
        <div class="form-group"><label>🏷️ 谁去过？</label><select id="destType">
            <option value="together">一起去过 ❤️</option>
            <option value="rui">Rui去过 👩</option>
            <option value="kalang">Kalang去过 👨</option>
            <option value="dream">梦想一起去 ✨</option>
        </select></div>
        <div class="form-group"><label>💭 回忆 / 备注</label><textarea id="destMemory" rows="2" placeholder="选填"></textarea></div>
        <div class="form-group"><label>🖼️ 照片链接</label><input type="text" id="destPhoto" placeholder="https://..."></div>
        <div id="photoPreview" class="photo-preview"></div>
        <hr>
        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeModal()">取消</button>
            <button class="btn-primary" onclick="saveDestination()">保存</button>
            <button class="btn-danger" id="deleteBtn" style="display:none;" onclick="deleteCurrentDestination()">删除</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
// 预设城市坐标 (x, y百分比)
const cityCoordinates = {
    "北京": { x: 65, y: 45 }, "上海": { x: 68, y: 50 }, "广州": { x: 63, y: 56 },
    "深圳": { x: 64, y: 57 }, "成都": { x: 58, y: 51 }, "杭州": { x: 67, y: 51 },
    "西安": { x: 60, y: 48 }, "重庆": { x: 59, y: 52 }, "南京": { x: 66, y: 49 },
    "武汉": { x: 63, y: 51 }, "厦门": { x: 66, y: 55 }, "青岛": { x: 67, y: 47 },
    "大理": { x: 56, y: 54 }, "丽江": { x: 56, y: 53 }, "三亚": { x: 61, y: 60 },
    "桂林": { x: 62, y: 54 }, "巴黎": { x: 35, y: 40 }, "东京": { x: 78, y: 48 },
    "纽约": { x: 20, y: 42 }, "伦敦": { x: 32, y: 38 }, "罗马": { x: 38, y: 41 },
    "悉尼": { x: 82, y: 75 }, "曼谷": { x: 62, y: 62 }, "首尔": { x: 75, y: 46 },
    "新加坡": { x: 65, y: 67 }, "巴厘岛": { x: 67, y: 70 }, "圣托里尼": { x: 40, y: 45 }
};

let destinations = [
    { id: 1, name: "巴黎", x: 35, y: 40, type: "together", memory: "第一次一起出国！埃菲尔铁塔下的日落太美了。", photo: "" },
    { id: 2, name: "东京", x: 78, y: 48, type: "rui", memory: "一个人的冒险 - 樱花和寿司之旅", photo: "" },
    { id: 3, name: "巴塞罗那", x: 36, y: 42, type: "kalang", memory: "高迪的建筑和美味的tapas", photo: "" },
    { id: 4, name: "圣托里尼", x: 40, y: 45, type: "dream", memory: "梦想中的蜜月目的地", photo: "" },
    { id: 5, name: "罗马", x: 38, y: 41, type: "together", memory: "吃了好多意面，在特雷维喷泉投了硬币", photo: "" }
];

let nextId = 6, chart, currentFilter = 'all';

function getMarkerColor(type) {
    return type === 'together' ? '#4a9b6e' : type === 'rui' ? '#5b8cc9' : '#e8a34b';
}

function renderMapMarkers() {
    const markersGroup = document.getElementById('markersGroup');
    if (!markersGroup) return;
    markersGroup.innerHTML = '';
    
    destinations.forEach(d => {
        if (d.type !== 'dream' && d.x && d.y) {
            // 将百分比转换为SVG坐标 (SVG宽900,高450)
            const svgX = (d.x / 100) * 900;
            const svgY = (d.y / 100) * 450;
            const markerColor = getMarkerColor(d.type);
            
            const marker = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            marker.setAttribute("cx", svgX);
            marker.setAttribute("cy", svgY);
            marker.setAttribute("r", "6");
            marker.setAttribute("fill", markerColor);
            marker.setAttribute("stroke", "white");
            marker.setAttribute("stroke-width", "2");
            marker.setAttribute("class", "marker-point");
            marker.setAttribute("style", "cursor:pointer");
            marker.onclick = (function(id) { return function() { openEditModal(id); }; })(d.id);
            
            // 添加标签
            const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
            text.setAttribute("x", svgX + 8);
            text.setAttribute("y", svgY - 5);
            text.setAttribute("font-size", "9");
            text.setAttribute("fill", "#3a5a3a");
            text.setAttribute("font-weight", "500");
            text.textContent = d.name.length > 6 ? d.name.substring(0,6) : d.name;
            
            markersGroup.appendChild(marker);
            markersGroup.appendChild(text);
        }
    });
}

function searchAndAddCity() {
    const query = document.getElementById('citySearch').value.trim();
    if (!query) { alert("请输入城市名称"); return; }
    
    if (cityCoordinates[query]) {
        const coords = cityCoordinates[query];
        openAddModalWithData(query, coords.x, coords.y);
    } else {
        alert("未找到该城市坐标，请手动添加");
        openAddModal();
        document.getElementById('destName').value = query;
    }
    document.getElementById('citySearch').value = '';
}

function quickAddCity(name, x, y) {
    openAddModalWithData(name, x, y);
}

function openAddModalWithData(name, x, y) {
    openAddModal();
    document.getElementById('destName').value = name;
    document.getElementById('destX').value = x;
    document.getElementById('destY').value = y;
}

function updateStats() {
    document.getElementById('togetherCount').innerText = destinations.filter(d => d.type === 'together').length;
    document.getElementById('ruiCount').innerText = destinations.filter(d => d.type === 'rui').length;
    document.getElementById('kalangCount').innerText = destinations.filter(d => d.type === 'kalang').length;
    document.getElementById('dreamCount').innerText = destinations.filter(d => d.type === 'dream').length;
}

function renderFeatured() {
    let recent = [...destinations].filter(d => d.type !== 'dream').slice(-4).reverse();
    let container = document.getElementById('featuredList');
    if (recent.length === 0) { container.innerHTML = '<p style="text-align:center; padding:30px;">还没有地点，添加第一个吧！</p>'; return; }
    container.innerHTML = recent.map(d => `
        <div class="destination-item" onclick="openEditModal(${d.id})">
            <div><span class="destination-badge badge-${d.type}"></span><strong>${d.name}</strong>${d.memory && d.memory.trim() ? `<div class="memory-text">${d.memory.substring(0, 60)}</div>` : ''}</div>
            <div><i class="fas fa-chevron-right"></i></div>
        </div>
    `).join('');
}

function renderAllDestinations(filter) {
    let filtered = filter === 'all' ? destinations : destinations.filter(d => d.type === filter);
    let container = document.getElementById('allDestinationsList');
    if (filtered.length === 0) { container.innerHTML = '<p style="text-align:center; padding:30px;">暂无目的地</p>'; return; }
    let typeLabel = { together: '❤️ 一起去过', rui: '👩 Rui去过', kalang: '👨 Kalang去过', dream: '✨ 梦想' };
    container.innerHTML = filtered.map(d => `
        <div class="destination-item" onclick="openEditModal(${d.id})">
            <div><span class="destination-badge badge-${d.type}"></span><strong>${d.name}</strong><div style="font-size:11px; color:#9e9b92; margin-top:2px;">${typeLabel[d.type]}</div>${d.memory && d.memory.trim() ? `<div class="memory-text">${d.memory.substring(0, 50)}</div>` : ''}</div>
            <div><i class="fas fa-edit"></i></div>
        </div>
    `).join('');
}

function renderBucketList() {
    let dreams = destinations.filter(d => d.type === 'dream');
    let container = document.getElementById('bucketListContainer');
    if (dreams.length === 0) { container.innerHTML = '<p style="text-align:center; padding:30px;">还没有梦想目的地，添加第一个吧！✨</p>'; return; }
    container.innerHTML = dreams.map(d => `
        <div class="destination-item" onclick="openEditModal(${d.id})">
            <div><span class="destination-badge badge-dream"></span><strong>⭐ ${d.name}</strong>${d.memory && d.memory.trim() ? `<div class="memory-text">${d.memory.substring(0, 60)}</div>` : ''}</div>
            <div><i class="fas fa-star"></i></div>
        </div>
    `).join('');
}

function updateChart() {
    let counts = ['together', 'rui', 'kalang', 'dream'].map(t => destinations.filter(d => d.type === t).length);
    if (chart) chart.destroy();
    let ctx = document.getElementById('travelChart').getContext('2d');
    chart = new Chart(ctx, { 
        type: 'doughnut', 
        data: { labels: ['一起去过', 'Rui', 'Kalang', '梦想'], datasets: [{ data: counts, backgroundColor: ['#4a9b6e', '#5b8cc9', '#e8a34b', '#d4af37'], borderWidth: 0 }] }, 
        options: { responsive: true, maintainAspectRatio: true, plugins: { legend: { position: 'bottom' } } } 
    });
    document.getElementById('statDetails').innerHTML = `
        <div style="display:grid; grid-template-columns:repeat(2,1fr); gap:12px; text-align:center;">
            <div>🌍 总共: ${counts.reduce((a,b)=>a+b,0)}</div>
            <div>❤️ 一起去过: ${counts[0]}</div>
            <div>👩 Rui: ${counts[1]}</div>
            <div>👨 Kalang: ${counts[2]}</div>
            <div>✨ 梦想: ${counts[3]}</div>
        </div>
    `;
}

function filterByType(type) { 
    showPage('destinations'); 
    document.querySelectorAll('#destinationFilters .filter-btn').forEach(btn => { btn.classList.remove('active'); if (btn.getAttribute('data-filter') === type) btn.classList.add('active'); }); 
    currentFilter = type;
    renderAllDestinations(type); 
}
