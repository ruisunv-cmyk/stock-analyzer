<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>STARFALL — An Arcade Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#000308;
    --abyss:#02060d;
    --glow:#5fb3d4;
    --ice:#a8d8e8;
    --foam:#d4eaf2;
    --gold:#d4a574;
    --danger:#ff4757;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{
    width:100%;height:100%;overflow:hidden;
    background:var(--void);color:var(--foam);
    font-family:'Inter',system-ui,sans-serif;
    font-weight:300;
    -webkit-font-smoothing:antialiased;
    user-select:none;
    touch-action:none;
  }
  #game{
    position:fixed;inset:0;
    display:block;
    cursor:crosshair;
  }

  /* ============ HUD ============ */
  .hud{
    position:fixed;inset:0;
    pointer-events:none;
    z-index:10;
    padding:32px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .hud-top{display:flex;justify-content:space-between;align-items:flex-start;gap:24px}
  .hud-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
  .stat{display:flex;flex-direction:column;gap:6px}
  .stat-label{
    font-size:10px;letter-spacing:.4em;text-transform:uppercase;
    color:rgba(168,216,232,.6);font-weight:400;
  }
  .stat-value{
    font-family:'Cormorant Garamond',serif;
    font-size:42px;font-style:italic;
    color:var(--foam);
    line-height:1;
    text-shadow:0 0 20px rgba(95,179,212,.5);
    transition:transform .2s var(--ease);
  }
  .stat-value.flash{transform:scale(1.15);color:var(--gold);text-shadow:0 0 30px var(--gold)}

  .health-bar{
    display:flex;gap:8px;margin-top:8px;
  }
  .health-pip{
    width:32px;height:6px;border-radius:3px;
    background:rgba(95,179,212,.2);
    border:1px solid rgba(95,179,212,.3);
    transition:all .3s var(--ease);
    overflow:hidden;
    position:relative;
  }
  .health-pip::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,var(--glow),var(--ice));
    transform-origin:left;
    transition:transform .4s var(--ease);
    box-shadow:0 0 10px var(--glow);
  }
  .health-pip.empty::before{transform:scaleX(0)}
  .health-pip.empty{border-color:rgba(255,71,87,.3)}

  .combo{
    font-family:'Cormorant Garamond',serif;
    font-size:72px;font-style:italic;
    color:var(--gold);
    text-shadow:0 0 40px rgba(212,165,116,.8);
    opacity:0;
    transform:scale(.5);
    transition:all .3s var(--ease);
    line-height:1;
  }
  .combo.active{opacity:1;transform:scale(1)}
  .combo-sub{
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--gold);opacity:.7;margin-top:4px;
  }

  /* ============ START SCREEN ============ */
  .screen{
    position:fixed;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:40px;
    background:radial-gradient(ellipse at center,rgba(2,6,13,.7),rgba(0,3,8,.95));
    backdrop-filter:blur(4px);
    z-index:20;
    opacity:0;visibility:hidden;
    transition:opacity .6s var(--ease),visibility .6s;
  }
  .screen.visible{opacity:1;visibility:visible}

  .title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(64px,14vw,180px);
    font-weight:400;font-style:italic;
    letter-spacing:-.02em;
    line-height:.9;
    background:linear-gradient(180deg,var(--foam) 0%,var(--ice) 40%,var(--glow) 100%);
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    text-align:center;
    filter:drop-shadow(0 0 60px rgba(95,179,212,.5));
    animation:titleFloat 4s ease-in-out infinite;
  }
  @keyframes titleFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-8px)}
  }
  .subtitle{
    font-size:11px;letter-spacing:.5em;text-transform:uppercase;
    color:rgba(168,216,232,.7);
    margin:32px 0 60px;
    text-align:center;
  }

  .btn{
    padding:18px 56px;
    background:transparent;
    border:1px solid var(--glow);
    color:var(--foam);
    font-family:'Inter',sans-serif;
    font-size:11px;letter-spacing:.4em;text-transform:uppercase;
    font-weight:400;
    border-radius:100px;
    cursor:pointer;
    transition:all .5s var(--ease);
    position:relative;
    overflow:hidden;
    z-index:1;
  }
  .btn::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(circle at center,rgba(95,179,212,.4),transparent 70%);
    opacity:0;transition:opacity .5s var(--ease);
    z-index:-1;
  }
  .btn:hover{
    border-color:var(--ice);
    box-shadow:0 0 60px rgba(95,179,212,.6),inset 0 0 20px rgba(95,179,212,.1);
    transform:translateY(-2px);
  }
  .btn:hover::before{opacity:1}

  .controls{
    margin-top:60px;
    display:flex;gap:48px;flex-wrap:wrap;justify-content:center;
    font-size:10px;letter-spacing:.25em;text-transform:uppercase;
    color:rgba(168,216,232,.5);
  }
  .controls span{
    display:flex;align-items:center;gap:12px;
  }
  .key{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:28px;height:28px;padding:0 8px;
    border:1px solid rgba(168,216,232,.3);
    border-radius:6px;
    font-size:11px;font-weight:500;
    color:var(--ice);
    background:rgba(95,179,212,.05);
  }

  .high-score{
    margin-top:40px;
    font-size:10px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(212,165,116,.7);
  }
  .high-score strong{
    color:var(--gold);font-family:'Cormorant Garamond',serif;
    font-size:22px;font-style:italic;letter-spacing:0;text-transform:none;
    margin-left:12px;
  }

  /* ============ GAME OVER ============ */
  .gameover-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(48px,9vw,96px);
    font-style:italic;
    color:var(--danger);
    text-shadow:0 0 60px rgba(255,71,87,.6);
    text-align:center;
    margin-bottom:16px;
  }
  .gameover-stats{
    display:flex;gap:56px;
    margin:40px 0 60px;
    flex-wrap:wrap;justify-content:center;
  }
  .gameover-stat{
    text-align:center;
  }
  .gameover-stat .label{
    font-size:10px;letter-spacing:.4em;text-transform:uppercase;
    color:rgba(168,216,232,.6);margin-bottom:8px;
  }
  .gameover-stat .value{
    font-family:'Cormorant Garamond',serif;
    font-size:48px;font-style:italic;
    color:var(--foam);
    text-shadow:0 0 30px rgba(95,179,212,.5);
  }
  .gameover-stat.best .value{color:var(--gold);text-shadow:0 0 30px rgba(212,165,116,.5)}

  /* ============ PAUSE ============ */
  .pause-title{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(56px,10vw,120px);
    font-style:italic;
    color:var(--ice);
    text-shadow:0 0 60px rgba(168,216,232,.5);
    text-align:center;
    margin-bottom:60px;
  }

  /* ============ FLOATING TEXT ============ */
  .float-text{
    position:fixed;
    font-family:'Cormorant Garamond',serif;
    font-size:24px;font-style:italic;
    color:var(--gold);
    pointer-events:none;
    z-index:15;
    text-shadow:0 0 20px rgba(212,165,116,.8);
    animation:floatUp 1s var(--ease) forwards;
  }
  @keyframes floatUp{
    0%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-150%) scale(1.3)}
  }

  /* ============ RESPONSIVE ============ */
  @media(max-width:800px){
    .hud{padding:20px}
    .stat-value{font-size:32px}
    .combo{font-size:48px}
    .health-pip{width:24px;height:5px}
    .controls{gap:24px;font-size:9px}
    .gameover-stats{gap:32px}
    .gameover-stat .value{font-size:36px}
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div class="hud">
  <div class="hud-top">
    <div class="stat">
      <div class="stat-label">Score</div>
      <div class="stat-value" id="scoreDisplay">0</div>
    </div>
    <div class="stat" style="text-align:right">
      <div class="stat-label">Wave</div>
      <div class="stat-value" id="waveDisplay">1</div>
    </div>
  </div>
  <div class="hud-bottom">
    <div class="stat">
      <div class="stat-label">Hull Integrity</div>
      <div class="health-bar" id="healthBar"></div>
    </div>
    <div id="comboDisplay">
      <div class="combo" id="comboValue">x1</div>
      <div class="combo-sub" id="comboLabel">Collect</div>
    </div>
  </div>
</div>

<!-- START SCREEN -->
<div class="screen visible" id="startScreen">
  <h1 class="title">Starfall</h1>
  <div class="subtitle">An Arcade Journey Through the Void</div>
  <button class="btn" id="startBtn">Begin</button>
  <div class="controls">
    <span><span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span> Move</span>
    <span><span class="key">SPACE</span> Boost</span>
    <span><span class="key">ESC</span> Pause</span>
    <span>Collect <span style="color:var(--gold)">✦</span> starlight</span>
    <span>Avoid <span style="color:var(--danger)">●</span> asteroids</span>
  </div>
  <div class="high-score">Best <strong id="startHighScore">0</strong></div>
</div>

<!-- PAUSE SCREEN -->
<div class="screen" id="pauseScreen">
  <h2 class="pause-title">Paused</h2>
  <button class="btn" id="resumeBtn">Resume</button>
  <div class="controls" style="margin-top:48px">
    <span><span class="key">ESC</span> Resume</span>
    <span><span class="key">Q</span> Quit</span>
  </div>
</div>

<!-- GAME OVER SCREEN -->
<div class="screen" id="gameoverScreen">
  <h2 class="gameover-title">Signal Lost</h2>
  <div class="gameover-stats">
    <div class="gameover-stat">
      <div class="label">Score</div>
      <div class="value" id="finalScore">0</div>
    </div>
    <div class="gameover-stat best">
      <div class="label">Best</div>
      <div class="value" id="bestScore">0</div>
    </div>
    <div class="gameover-stat">
      <div class="label">Wave</div>
      <div class="value" id="finalWave">1</div>
    </div>
  </div>
  <button class="btn" id="retryBtn">Try Again</button>
</div>

<script>
(() => {
  "use strict";

  // ============================================================
  // SETUP
  // ============================================================
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  let W = 0, H = 0, dpr = 1;
  function resize(){
    dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  window.addEventListener("resize", resize);

  // ============================================================
  // AUDIO (Web Audio API — no external files)
  // ============================================================
  let audioCtx = null;
  function initAudio(){
    if (audioCtx) return;
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch(e) { audioCtx = null; }
  }
  function playTone(freq, duration, type = "sine", volume = 0.1){
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }
  function playCollect(){ playTone(880 + Math.random() * 200, 0.15, "sine", 0.08); }
  function playHit(){ playTone(120, 0.3, "sawtooth", 0.15); playTone(80, 0.4, "square", 0.1); }
  function playWave(){ playTone(523, 0.2, "sine", 0.08); setTimeout(() => playTone(659, 0.2, "sine", 0.08), 100); setTimeout(() => playTone(784, 0.3, "sine", 0.1), 200); }
  function playGameOver(){ playTone(220, 0.5, "sawtooth", 0.15); setTimeout(() => playTone(165, 0.5, "sawtooth", 0.15), 200); setTimeout(() => playTone(110, 0.8, "sawtooth", 0.2), 400); }

  // ============================================================
  // GAME STATE
  // ============================================================
  const state = {
    running: false,
    paused: false,
    over: false,
    score: 0,
    wave: 1,
    health: 5,
    maxHealth: 5,
    combo: 1,
    comboTime: 0,
    waveTimer: 0,
    difficulty: 1,
    time: 0,
    best: parseInt(localStorage.getItem("starfall_best") || "0", 10)
  };

  const player = {
    x: 0, y: 0,
    vx: 0, vy: 0,
    radius: 14,
    angle: -Math.PI / 2,
    boosting: false,
    invuln: 0,
    trail: []
  };

  const keys = {};
  const asteroids = [];
  const stars = [];
  const particles = [];
  const starsBG = [];

  // ============================================================
  // INPUT
  // ============================================================
  document.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;
    if (e.key === "Escape" && state.running && !state.paused) pauseGame();
    else if (e.key === "Escape" && state.paused) resumeGame();
    if (e.key.toLowerCase() === "q" && state.paused) quitToMenu();
    if (e.key === " " && state.running) e.preventDefault();
  });
  document.addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });

  // touch support
  let touchTarget = null;
  canvas.addEventListener("touchstart", e => {
    e.preventDefault();
    const t = e.touches[0];
    touchTarget = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  canvas.addEventListener("touchmove", e => {
    e.preventDefault();
    const t = e.touches[0];
    touchTarget = { x: t.clientX, y: t.clientY };
  }, { passive: false });
  canvas.addEventListener("touchend", e => {
    e.preventDefault();
    touchTarget = null;
  }, { passive: false });

  // ============================================================
  // SPAWNING
  // ============================================================
  function spawnStar(){
    const margin = 60;
    stars.push({
      x: margin + Math.random() * (W - margin * 2),
      y: margin + Math.random() * (H - margin * 2),
      radius: 8,
      phase: Math.random() * Math.PI * 2,
      age: 0,
      life: 8 + Math.random() * 4
    });
  }
  function spawnAsteroid(){
    const side = Math.floor(Math.random() * 4);
    let x, y;
    const margin = 80;
    if (side === 0){ x = Math.random() * W; y = -margin; }
    else if (side === 1){ x = W + margin; y = Math.random() * H; }
    else if (side === 2){ x = Math.random() * W; y = H + margin; }
    else { x = -margin; y = Math.random() * H; }
    const speed = 0.8 + Math.random() * 0.8 + state.difficulty * 0.15;
    const angle = Math.atan2(H/2 - y + (Math.random()-0.5)*200, W/2 - x + (Math.random()-0.5)*200);
    const radius = 18 + Math.random() * 22;
    asteroids.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      radius,
      rot: 0,
      rotSpeed: (Math.random() - 0.5) * 0.04,
      vertices: Array.from({ length: 7 }, () => 0.7 + Math.random() * 0.5),
      health: radius > 28 ? 2 : 1
    });
  }

  // background stars
  function initBGStars(){
    starsBG.length = 0;
    const count = Math.floor((W * H) / 6000);
    for (let i = 0; i < count; i++){
      starsBG.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: 0.3 + Math.random() * 0.7,
        tw: Math.random() * Math.PI * 2,
        size: Math.random() > 0.85 ? 1.8 : 1
      });
    }
  }
  initBGStars();
  window.addEventListener("resize", initBGStars);

  // ============================================================
  // EFFECTS
  // ============================================================
  function burst(x, y, count, color, speed = 4){
    for (let i = 0; i < count; i++){
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
      const s = speed * (0.5 + Math.random());
      particles.push({
        x, y,
        vx: Math.cos(angle) * s,
        vy: Math.sin(angle) * s,
        life: 1,
        decay: 0.02 + Math.random() * 0.02,
        color,
        size: 2 + Math.random() * 3
      });
    }
  }
  function floatText(text, x, y, color = "#d4a574"){
    const el = document.createElement("div");
    el.className = "float-text";
    el.textContent = text;
    el.style.left = x + "px";
    el.style.top = y + "px";
    el.style.color = color;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
  }

  // ============================================================
  // GAME LIFECYCLE
  // ============================================================
  function startGame(){
    initAudio();
    state.running = true;
    state.paused = false;
    state.over = false;
    state.score = 0;
    state.wave = 1;
    state.health = state.maxHealth;
    state.combo = 1;
    state.comboTime = 0;
    state.waveTimer = 0;
    state.difficulty = 1;
    state.time = 0;

    player.x = W / 2;
    player.y = H / 2;
    player.vx = 0;
    player.vy = 0;
    player.angle = -Math.PI / 2;
    player.invuln = 1.5;
    player.trail = [];

    asteroids.length = 0;
    stars.length = 0;
    particles.length = 0;

    for (let i = 0; i < 3; i++) spawnStar();
    updateHUD();

    document.getElementById("startScreen").classList.remove("visible");
    document.getElementById("gameoverScreen").classList.remove("visible");
    document.getElementById("pauseScreen").classList.remove("visible");
  }

  function pauseGame(){
    state.paused = true;
    document.getElementById("pauseScreen").classList.add("visible");
  }
  function resumeGame(){
    state.paused = false;
    document.getElementById("pauseScreen").classList.remove("visible");
  }
  function quitToMenu(){
    state.running = false;
    state.paused = false;
    document.getElementById("pauseScreen").classList.remove("visible");
    document.getElementById("startScreen").classList.add("visible");
    document.getElementById("startHighScore").textContent = state.best;
  }
  function gameOver(){
    state.running = false;
    state.over = true;
    playGameOver();
    if (state.score > state.best){
      state.best = state.score;
      localStorage.setItem("starfall_best", state.best.toString());
    }
    document.getElementById("finalScore").textContent = state.score;
    document.getElementById("bestScore").textContent = state.best;
    document.getElementById("finalWave").textContent = state.wave;
    document.getElementById("gameoverScreen").classList.add("visible");
    // burst at player position
    burst(player.x, player.y, 40, "#ff4757", 8);
    burst(player.x, player.y, 30, "#d4a574", 6);
  }

  // ============================================================
  // HUD UPDATE
  // ============================================================
  function updateHUD(){
    document.getElementById("scoreDisplay").textContent = state.score.toLocaleString();
    document.getElementById("waveDisplay").textContent = state.wave;
    const bar = document.getElementById("healthBar");
    if (bar.children.length !== state.maxHealth){
      bar.innerHTML = "";
      for (let i = 0; i < state.maxHealth; i++){
        const pip = document.createElement("div");
        pip.className = "health-pip";
        bar.appendChild(pip);
      }
    }
    Array.from(bar.children).forEach((pip, i) => {
      pip.classList.toggle("empty", i >= state.health);
    });
    const combo = document.getElementById("comboValue");
    const comboLabel = document.getElementById("comboLabel");
    if (state.combo > 1){
      combo.textContent = "x" + state.combo;
      combo.classList.add("active");
      comboLabel.textContent = "Combo";
    } else {
      combo.classList.remove("active");
    }
  }

  // ============================================================
  // UPDATE
  // ============================================================
  function update(dt){
    if (!state.running || state.paused) return;

    state.time += dt;
    state.difficulty = 1 + state.time / 30;
    state.waveTimer += dt;

    if (state.waveTimer > 20){
      state.waveTimer = 0;
      state.wave++;
      playWave();
      floatText("WAVE " + state.wave, W / 2, H / 2 - 100, "#5fb3d4");
    }

    // player movement
    const accel = 0.6;
    const friction = 0.92;
    let ax = 0, ay = 0;
    if (keys["w"] || keys["arrowup"]) ay -= 1;
    if (keys["s"] || keys["arrowdown"]) ay += 1;
    if (keys["a"] || keys["arrowleft"]) ax -= 1;
    if (keys["d"] || keys["arrowright"]) ax += 1;

    if (touchTarget){
      const dx = touchTarget.x - player.x;
      const dy = touchTarget.y - player.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 10){
        ax = dx / dist;
        ay = dy / dist;
      }
    }

    const len = Math.hypot(ax, ay);
    if (len > 0){ ax /= len; ay /= len; }

    player.boosting = keys[" "] && len > 0;
    const boostMult = player.boosting ? 1.8 : 1;
    player.vx += ax * accel * boostMult;
    player.vy += ay * accel * boostMult;
    player.vx *= friction;
    player.vy *= friction;
    player.x += player.vx;
    player.y += player.vy;

    // wrap around edges
    if (player.x < -20) player.x = W + 20;
    if (player.x > W + 20) player.x = -20;
    if (player.y < -20) player.y = H + 20;
    if (player.y > H + 20) player.y = -20;

    if (player.invuln > 0) player.invuln -= dt;

    // angle from velocity
    if (Math.hypot(player.vx, player.vy) > 0.5){
      player.angle = Math.atan2(player.vy, player.vx);
    }

    // trail
    player.trail.push({ x: player.x, y: player.y, life: 1 });
    if (player.trail.length > 14) player.trail.shift();
    player.trail.forEach(t => t.life -= 0.06);

    // combo timer
    if (state.comboTime > 0){
      state.comboTime -= dt;
      if (state.comboTime <= 0){
        state.combo = 1;
        updateHUD();
      }
    }

    // spawn asteroids
    if (Math.random() < 0.02 * state.difficulty){
      spawnAsteroid();
    }

    // update asteroids
    for (let i = asteroids.length - 1; i >= 0; i--){
      const a = asteroids[i];
      a.x += a.vx;
      a.y += a.vy;
      a.rot += a.rotSpeed;

      // remove if far off screen
      if (a.x < -200 || a.x > W + 200 || a.y < -200 || a.y > H + 200){
        asteroids.splice(i, 1);
        continue;
      }

      // collision with player
      const dist = Math.hypot(a.x - player.x, a.y - player.y);
      if (dist < a.radius + player.radius && player.invuln <= 0){
        // hit
        state.health--;
        state.combo = 1;
        state.comboTime = 0;
        player.invuln = 1.5;
        playHit();
        burst(player.x, player.y, 20, "#ff4757", 6);
        updateHUD();
        if (state.health <= 0){
          gameOver();
          return;
        }
      }
    }

    // update stars (collectibles)
    for (let i = stars.length - 1; i >= 0; i--){
      const s = stars[i];
      s.age += dt;
      s.phase += dt * 3;

      if (s.age > s.life){
        stars.splice(i, 1);
        spawnStar();
        continue;
      }

      const dist = Math.hypot(s.x - player.x, s.y - player.y);
      if (dist < s.radius + player.radius + 6){
        // collect
        state.combo++;
        state.comboTime = 4;
        const points = 10 * state.combo;
        state.score += points;
        playCollect();
        floatText("+" + points, s.x, s.y, "#d4a574");
        burst(s.x, s.y, 10, "#d4a574", 4);
        stars.splice(i, 1);
        spawnStar();
        updateHUD();
      }
    }

    // update particles
    for (let i = particles.length - 1; i >= 0; i--){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.96;
      p.vy *= 0.96;
      p.life -= p.decay;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  // ============================================================
  // RENDER
  // ============================================================
  function render(){
    // trail effect
    ctx.fillStyle = "rgba(0,3,8,0.3)";
    ctx.fillRect(0, 0, W, H);

    // radial glow behind scene
    const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H) * 0.7);
    grad.addColorStop(0, "rgba(10,26,40,0.3)");
    grad.addColorStop(1, "rgba(0,3,8,0)");
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // background stars
    for (const s of starsBG){
      s.tw += 0.02;
      const alpha = 0.3 + Math.sin(s.tw) * 0.3;
      ctx.fillStyle = `rgba(245,240,232,${alpha * s.z})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    // collectible stars
    for (const s of stars){
      const pulse = 1 + Math.sin(s.phase) * 0.15;
      const alpha = Math.min(1, (s.life - s.age) / 2);
      ctx.save();
      ctx.globalAlpha = alpha;
      // glow
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.radius * 4);
      g.addColorStop(0, "rgba(212,165,116,0.5)");
      g.addColorStop(1, "rgba(212,165,116,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.radius * 4, 0, Math.PI * 2);
      ctx.fill();
      // star shape
      ctx.translate(s.x, s.y);
      ctx.rotate(s.phase * 0.3);
      ctx.fillStyle = "#d4a574";
      ctx.beginPath();
      for (let k = 0; k < 4; k++){
        const ang = (k / 4) * Math.PI * 2;
        const r1 = s.radius * pulse;
        const r2 = s.radius * 0.3;
        ctx.lineTo(Math.cos(ang) * r1, Math.sin(ang) * r1);
        ctx.lineTo(Math.cos(ang + Math.PI / 4) * r2, Math.sin(ang + Math.PI / 4) * r2);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // asteroids
    for (const a of asteroids){
      ctx.save();
      ctx.translate(a.x, a.y);
      ctx.rotate(a.rot);

      // glow
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, a.radius * 2);
      g.addColorStop(0, "rgba(138,132,120,0.15)");
      g.addColorStop(1, "rgba(138,132,120,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, a.radius * 2, 0, Math.PI * 2);
      ctx.fill();

      // body
      ctx.fillStyle = "rgba(90,90,90,0.9)";
      ctx.strokeStyle = "rgba(168,216,232,0.4)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      a.vertices.forEach((v, i) => {
        const ang = (i / a.vertices.length) * Math.PI * 2;
        const r = a.radius * v;
        if (i === 0) ctx.moveTo(Math.cos(ang) * r, Math.sin(ang) * r);
        else ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
      });
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // craters
      ctx.fillStyle = "rgba(40,40,40,0.5)";
      ctx.beginPath();
      ctx.arc(-a.radius * 0.3, -a.radius * 0.2, a.radius * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(a.radius * 0.25, a.radius * 0.15, a.radius * 0.15, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    // particles
    for (const p of particles){
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // player trail
    player.trail.forEach((t, i) => {
      if (t.life <= 0) return;
      const alpha = t.life * 0.5;
      const size = player.radius * 0.5 * t.life;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#5fb3d4";
      ctx.beginPath();
      ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;

    // player
    if (state.running && !state.over){
      ctx.save();
      ctx.translate(player.x, player.y);
      ctx.rotate(player.angle + Math.PI / 2);

      // invulnerability flash
      if (player.invuln > 0 && Math.floor(player.invuln * 10) % 2 === 0){
        ctx.globalAlpha = 0.5;
      }

      // glow
      const pglow = ctx.createRadialGradient(0, 0, 0, 0, 0, player.radius * 3);
      pglow.addColorStop(0, "rgba(95,179,212,0.4)");
      pglow.addColorStop(1, "rgba(95,179,212,0)");
      ctx.fillStyle = pglow;
      ctx.beginPath();
      ctx.arc(0, 0, player.radius * 3, 0, Math.PI * 2);
      ctx.fill();

      // ship body
      ctx.fillStyle = player.boosting ? "#d4a574" : "#5fb3d4";
      ctx.strokeStyle = "#d4eaf2";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(0, -player.radius);
      ctx.lineTo(-player.radius * 0.7, player.radius * 0.7);
      ctx.lineTo(0, player.radius * 0.4);
      ctx.lineTo(player.radius * 0.7, player.radius * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // cockpit
      ctx.fillStyle = "#d4eaf2";
      ctx.beginPath();
      ctx.arc(0, -player.radius * 0.2, player.radius * 0.25, 0, Math.PI * 2);
      ctx.fill();

      // boost flame
      if (player.boosting){
        ctx.fillStyle = "rgba(212,165,116,0.8)";
        ctx.beginPath();
        ctx.moveTo(-player.radius * 0.3, player.radius * 0.5);
        ctx.lineTo(0, player.radius * 1.5 + Math.random() * 10);
        ctx.lineTo(player.radius * 0.3, player.radius * 0.5);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    // vignette
    const vg = ctx.createRadialGradient(W/2, H/2, Math.min(W,H) * 0.4, W/2, H/2, Math.max(W,H) * 0.7);
    vg.addColorStop(0, "rgba(0,0,0,0)");
    vg.addColorStop(1, "rgba(0,3,8,0.6)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, W, H);
  }

  // ============================================================
  // MAIN LOOP
  // ============================================================
  let lastTime = performance.now();
  function loop(now){
    const dt = Math.min((now - lastTime) / 1000, 0.05);
    lastTime = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // ============================================================
  // UI BINDINGS
  // ============================================================
  document.getElementById("startBtn").addEventListener("click", startGame);
  document.getElementById("retryBtn").addEventListener("click", startGame);
  document.getElementById("resumeBtn").addEventListener("click", resumeGame);
  document.getElementById("startHighScore").textContent = state.best;

  // initial render of menu background
  updateHUD();
})();
</script>
