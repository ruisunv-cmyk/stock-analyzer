<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Stock Trend Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
            color: #e0e0e0;
            padding: 20px;
            min-height: 100vh;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #4facfe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .sub { color: #8a8aa0; margin-bottom: 2rem; }
        .card {
            background: rgba(30, 34, 58, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(79, 172, 254, 0.2);
        }
        .search-box { display: flex; gap: 10px; margin-bottom: 2rem; flex-wrap: wrap; }
        input {
            flex: 1;
            padding: 12px 20px;
            background: #1e1f2e;
            border: 1px solid #4facfe;
            border-radius: 12px;
            color: white;
            font-size: 16px;
        }
        button {
            background: #4facfe;
            color: white;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        button:hover { transform: translateY(-2px); background: #6bb8ff; }
        .metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .metric {
            background: rgba(0,0,0,0.3);
            padding: 1rem;
            border-radius: 12px;
            text-align: center;
        }
        .metric-value { font-size: 1.8rem; font-weight: bold; color: #4facfe; }
        .metric-label { font-size: 0.8rem; color: #aaa; margin-top: 5px; }
        .news-item {
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 12px 0;
            cursor: pointer;
        }
        .news-item:hover { background: rgba(79,172,254,0.1); }
        .sentiment {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 20px;
            display: inline-block;
        }
        .bullish { background: #00c85320; color: #00c853; border: 1px solid #00c85340; }
        .bearish { background: #d5000020; color: #ff6b6b; border: 1px solid #d5000040; }
        .neutral { background: #ffa50020; color: #ffa500; border: 1px solid #ffa50040; }
        .positive { color: #00c853; }
        .negative { color: #ff6b6b; }
        .loading { text-align: center; padding: 40px; }
        .spinner {
            border: 3px solid rgba(79,172,254,0.3);
            border-top: 3px solid #4facfe;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .settings-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #2a2e4a;
            padding: 12px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #1a1f3a;
            padding: 2rem;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
        }
        .modal input { width: 100%; margin: 10px 0; padding: 10px; }
        .ai-summary {
            background: linear-gradient(135deg, #1e2240, #15192e);
            padding: 1.2rem;
            border-radius: 12px;
            margin-top: 1rem;
            border-left: 3px solid #4facfe;
        }
        h3 { margin-bottom: 1rem; color: #4facfe; }
        .price { font-size: 2rem; font-weight: bold; display: inline-block; margin-right: 15px; }
        .change { font-size: 1.2rem; }
        .error { background: #ff000020; padding: 20px; border-radius: 12px; }
    </style>
</head>
<body>
<div class="container">
    <h1>📊 AI Stock Trend Analyzer</h1>
    <div class="sub">Market signals + Daily news + Fear & Greed + AI Analysis</div>
    
    <div class="card">
        <div class="search-box">
            <input type="text" id="stockInput" placeholder="Enter stock symbol (e.g., AAPL, TSLA, NVDA)" value="AAPL">
            <button id="analyzeBtn">🔍 Analyze Now</button>
        </div>
        
        <div id="results">
            <div style="text-align: center; padding: 40px;">Enter a stock symbol above to start</div>
        </div>
    </div>
</div>

<div class="settings-btn" id="settingsBtn">⚙️ API Keys</div>
<div id="settingsModal" class="modal">
    <div class="modal-content">
        <h3>API Settings</h3>
        <p style="font-size: 0.8rem; margin-bottom: 1rem;">Your keys are stored locally in your browser - never shared</p>
        <label>🔑 Claude API Key:</label>
        <input type="password" id="claudeKey" placeholder="sk-ant-api...">
        <label style="margin-top: 15px;">📰 NewsAPI Key (free from newsapi.org):</label>
        <input type="password" id="newsKey" placeholder="Your NewsAPI key">
        <button id="saveKeysBtn" style="margin-top: 20px; width: 100%;">Save Keys</button>
    </div>
</div>

<script>
    let claudeApiKey = localStorage.getItem('claude_api_key');
    let newsApiKey = localStorage.getItem('news_api_key');
    
    document.getElementById('saveKeysBtn').addEventListener('click', () => {
        claudeApiKey = document.getElementById('claudeKey').value;
        newsApiKey = document.getElementById('newsKey').value;
        if(claudeApiKey) localStorage.setItem('claude_api_key', claudeApiKey);
        if(newsApiKey) localStorage.setItem('news_api_key', newsApiKey);
        document.getElementById('settingsModal').style.display = 'none';
        alert('Keys saved! Now analyze a stock.');
    });
    
    document.getElementById('settingsBtn').addEventListener('click', () => {
        document.getElementById('claudeKey').value = claudeApiKey || '';
        document.getElementById('newsKey').value = newsApiKey || '';
        document.getElementById('settingsModal').style.display = 'flex';
    });
    
    window.addEventListener('click', (e) => {
        if(e.target === document.getElementById('settingsModal')) 
            document.getElementById('settingsModal').style.display = 'none';
    });
    
    document.getElementById('analyzeBtn').addEventListener('click', async () => {
        const symbol = document.getElementById('stockInput').value.toUpperCase();
        if(!symbol) { alert('Enter a stock symbol'); return; }
        if(!claudeApiKey) { alert('Please set your Claude API key first (click the ⚙️ button)'); return; }
        
        document.getElementById('results').innerHTML = '<div class="loading"><div class="spinner"></div><p>Analyzing ' + symbol + '...</p></div>';
        
        try {
            const priceRes = await fetch(`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${symbol}&apikey=demo`);
            const priceData = await priceRes.json();
            
            let currentPrice = 'N/A', change = 0, changePercent = 0;
            if(priceData['Global Quote']) {
                currentPrice = parseFloat(priceData['Global Quote']['05. price']).toFixed(2);
                change = parseFloat(priceData['Global Quote']['09. change']).toFixed(2);
                changePercent = parseFloat(priceData['Global Quote']['10. change percent'].replace('%','')).toFixed(2);
            }
            
            let newsArticles = [];
            if(newsApiKey) {
                const newsRes = await fetch(`https://newsapi.org/v2/everything?q=${symbol}+stock&language=en&pageSize=6&apiKey=${newsApiKey}`);
                const newsData = await newsRes.json();
                newsArticles = newsData.articles || [];
            }
            
            let fearGreedScore = 50;
            if(changePercent > 2) fearGreedScore = 70 + Math.min(25, changePercent);
            else if(changePercent < -2) fearGreedScore = 30 - Math.min(25, Math.abs(changePercent));
            
            let fearGreedLabel = fearGreedScore >= 65 ? 'Greed' : (fearGreedScore <= 35 ? 'Fear' : 'Neutral');
            let marketSignal = changePercent > 1.5 ? 'Bullish' : (changePercent < -1.5 ? 'Bearish' : 'Neutral');
            
            let newsSentiment = 'neutral';
            let bullishCount = 0, bearishCount = 0;
            const bullishWords = ['surge', 'rally', 'gain', 'bullish', 'upgrade', 'buy', 'positive', 'growth'];
            const bearishWords = ['drop', 'fall', 'bearish', 'downgrade', 'sell', 'negative', 'decline', 'crash'];
            
            newsArticles.forEach(article => {
                const title = (article.title || '').toLowerCase();
                const desc = (article.description || '').toLowerCase();
                bullishWords.forEach(w => { if(title.includes(w) || desc.includes(w)) bullishCount++; });
                bearishWords.forEach(w => { if(title.includes(w) || desc.includes(w)) bearishCount++; });
            });
            
            if(bullishCount > bearishCount + 1) newsSentiment = 'bullish';
            else if(bearishCount > bullishCount + 1) newsSentiment = 'bearish';
            
            let aiSummary = 'Generating AI analysis...';
            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': claudeApiKey,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'claude-3-sonnet-20241022',
                        max_tokens: 300,
                        messages: [{
                            role: 'user',
                            content: `Analyze ${symbol} stock. Price: $${currentPrice}, Change: ${changePercent}%, Market Signal: ${marketSignal}, News Sentiment: ${newsSentiment}, Fear & Greed: ${fearGreedLabel} (${fearGreedScore}/100). Give a 2-3 sentence recommendation: Bullish, Bearish, or Neutral. Be specific.`
                        }]
                    })
                });
                const data = await response.json();
                aiSummary = data.content?.[0]?.text || 'Analysis complete - check the metrics above.';
            } catch(e) {
                aiSummary = `Based on the data: ${marketSignal} signal with ${newsSentiment} news sentiment suggests ${marketSignal === 'Bullish' ? 'potential upside' : (marketSignal === 'Bearish' ? 'caution advised' : 'wait for clearer direction')}.`;
            }
            
            document.getElementById('results').innerHTML = `
                <div style="margin-bottom: 20px;">
                    <span class="price">$${currentPrice}</span>
                    <span class="change ${change >= 0 ? 'positive' : 'negative'}">${change >= 0 ? '+' : ''}${change} (${changePercent}%)</span>
                </div>
                
                <div class="metrics">
                    <div class="metric"><div class="metric-value">${marketSignal}</div><div class="metric-label">Market Signal</div></div>
                    <div class="metric"><div class="metric-value ${newsSentiment === 'bullish' ? 'positive' : (newsSentiment === 'bearish' ? 'negative' : '')}">${newsSentiment.toUpperCase()}</div><div class="metric-label">News Sentiment</div></div>
                    <div class="metric"><div class="metric-value" style="color: ${fearGreedScore >= 65 ? '#ff9800' : (fearGreedScore <= 35 ? '#ff6b6b' : '#4facfe')}">${fearGreedLabel}</div><div class="metric-label">Fear & Greed (${fearGreedScore})</div></div>
                </div>
                
                <div class="ai-summary">
                    <h3>🤖 AI Analysis (Claude)</h3>
                    <p>${aiSummary}</p>
                </div>
                
                <div style="margin-top: 20px;">
                    <h3>📰 Latest News</h3>
                    ${newsArticles.length > 0 ? newsArticles.map(article => `
                        <div class="news-item" onclick="window.open('${article.url}', '_blank')">
                            <strong>${article.title || 'No title'}</strong><br>
                            <small>${article.source?.name || ''} • ${new Date(article.publishedAt).toLocaleDateString()}</small>
                            <div style="margin-top: 5px;">
                                <span class="sentiment ${newsSentiment}">Read more</span>
                            </div>
                        </div>
                    `).join('') : '<p>Add a NewsAPI key (free from newsapi.org) to see latest news</p>'}
                </div>
            `;
        } catch(error) {
            document.getElementById('results').innerHTML = `<div class="error">Error: ${error.message}<br><br>Make sure you have a valid Claude API key. Click the ⚙️ button to add it.</div>`;
        }
    });
</script>
</body>
</html>
