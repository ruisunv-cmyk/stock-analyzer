<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditline — Internal Audit Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  --bg:#edf1f4;--surf:#fff;--ink:#14202b;--mute:#5c6b78;--line:#dbe2e8;
  --brand:#0f5c63;--soft:#d9eded;--on:#fff;
  --crit:#b3261e;--high:#d9731a;--med:#b8920f;--low:#2f8a63;--ok:#2f8a63;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 6px 20px -8px rgba(20,32,43,.12)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0d1418;--surf:#151f25;--ink:#e6edf1;--mute:#93a3ae;
  --line:#26343d;--brand:#4fb3ba;--soft:#173a3e;--on:#071418;
  --crit:#ff7b72;--high:#f0a050;--med:#e3c14d;--low:#5fcf9d;--ok:#5fcf9d;
  --shadow:0 1px 2px rgba(0,0,0,.4)
}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:700 20px "Bricolage Grotesque",sans-serif}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo i::after{content:"";width:10px;height:10px;border:2.5px solid var(--on);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
nav small{background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1320px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:28px}.head p{margin:2px 0 0;color:var(--mute);max-width:640px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:9px 15px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.kpi b{display:block;font:700 32px/1.1 "Bricolage Grotesque",sans-serif}
.kpi span,.sub{color:var(--mute);font-size:13px}.sub{display:block}
.kpi.warn b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}
.Open{color:var(--high)}.InProgress{color:var(--med)}.Closed{color:var(--ok)}
.over{color:var(--crit);font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}.item:first-of-type{border-top:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}.tools input{max-width:280px}.tools select{max-width:180px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--mute)}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.tbl{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mute);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.stat{background:var(--bg);border-radius:20px;padding:3px 12px;font-size:12px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.tk{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--surf);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surf);color:var(--ink);padding:24px;width:min(560px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,24,.55)}dialog h2{margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.f .w{grid-column:1/-1}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:0;background:var(--surf);padding-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.b{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.b .n{width:150px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .t{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.b .t i{display:block;height:100%}
.mini{font-size:12px;color:var(--mute)}
@media(max-width:960px){.grid3{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:5;overflow-x:auto}
.logo{padding:0 8px 0 0}.logo span,.spacer,aside .ghost{display:none}nav{display:flex;gap:4px;white-space:nowrap}nav small{display:none}
.grid2,.board{grid-template-columns:1fr}}
@media print{@page{margin:14mm}aside,.btns,.tools,.toast{display:none!important}
.app{display:block}main{padding:0;max-width:none}body{background:#fff}.card{box-shadow:none;break-inside:avoid}.pb{break-after:page}.tbl{overflow:visible}table{min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span>Auditline</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="settings">Settings</button>
  <button class="ghost" id="reset">Reset data</button>
</aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
