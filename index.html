<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditline — Internal Audit Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  --bg:#edf1f4;--surf:#fff;--ink:#14202b;--mute:#5c6b78;--line:#dbe2e8;
  --brand:#0f5c63;--soft:#d9eded;--on:#fff;
  --crit:#b3261e;--high:#d9731a;--med:#b8920f;--low:#2f8a63;--ok:#2f8a63;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 6px 20px -8px rgba(20,32,43,.12)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0d1418;--surf:#151f25;--ink:#e6edf1;--mute:#93a3ae;
  --line:#26343d;--brand:#4fb3ba;--soft:#173a3e;--on:#071418;
  --crit:#ff7b72;--high:#f0a050;--med:#e3c14d;--low:#5fcf9d;--ok:#5fcf9d;
  --shadow:0 1px 2px rgba(0,0,0,.4)
}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:700 20px "Bricolage Grotesque",sans-serif}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo i::after{content:"";width:10px;height:10px;border:2.5px solid var(--on);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
nav small{background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute);margin-top:6px;width:100%;text-align:left}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1320px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:28px}.head p{margin:2px 0 0;color:var(--mute);max-width:640px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:9px 15px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.kpi b{display:block;font:700 32px/1.1 "Bricolage Grotesque",sans-serif}
.kpi span,.sub{color:var(--mute);font-size:13px}.sub{display:block}
.kpi.warn b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}
.Open{color:var(--high)}.InProgress{color:var(--med)}.Closed{color:var(--ok)}
.over{color:var(--crit);font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}.item:first-of-type{border-top:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}.tools input{max-width:280px}.tools select{max-width:200px}
.tbl{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mute);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.stat{background:var(--bg);border-radius:20px;padding:3px 12px;font-size:12px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surf);color:var(--ink);padding:24px;width:min(620px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,24,.55)}dialog h2{margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.f .w{grid-column:1/-1}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:0;background:var(--surf);padding-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.toast.show{opacity:1}
.b{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.b .n{width:180px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .t{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.b .t i{display:block;height:100%}
.mini{font-size:12px;color:var(--mute)}
.import-hint{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--brand);margin-bottom:12px}
@media(max-width:860px){.app{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:5;overflow-x:auto;gap:8px}
.logo{padding:0 8px 0 0}.logo span,.spacer,aside .ghost{display:none}nav{display:flex;gap:4px;white-space:nowrap}nav small{display:none}
.grid2{grid-template-columns:1fr}.f{grid-template-columns:1fr}}
@media print{@page{margin:14mm}aside,.btns,.tools,.toast,.import-hint{display:none!important}
.app{display:block}main{padding:0;max-width:none}body{background:#fff}.card{box-shadow:none;break-inside:avoid}.pb{break-after:page}.tbl{overflow:visible}table{min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span>Auditline</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="import-btn">Import from Excel</button>
  <button class="ghost" id="settings">Settings</button>
  <button class="ghost" id="reset">Reset data</button>
</aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

/* ============================================================
   CONSTANTS
   ============================================================ */
var KEY = "auditline-v1";
var SEV = ["High","Medium","Low"];
var FST = ["Open","In Progress","Closed"];

/* ============================================================
   SAMPLE DATA — real rows from your workbook (5 findings,
   3 engagements, 5 entities). Full data: use Import.
   ============================================================ */
function seed(){
  return {
    meta:{orgName:"Tecan Group",currentUser:"Internal Audit"},
    ent:[
      {id:1,code:"105",name:"Tecan Schweiz AG",short:"T-CH"},
      {id:2,code:"140",name:"Tecan US Inc.",short:"T-US"},
      {id:3,code:"170",name:"Tecan UK Ltd.",short:"T-UK"},
      {id:4,code:"280",name:"Tecan Trading AG",short:"T-TR"},
      {id:5,code:"360",name:"Tecan China",short:"T-CN"}
    ],
    eng:[
      {id:1,lastAudited:"2025",entityCode:"0105",entity:"T-CH",start:"2026-04-13",end:"2026-04-30",area1:"Indirect Expenses",area2:"Balance Sheet Review",area3:"Credit Management",location:"CH",status:"Planned",report:""},
      {id:2,lastAudited:"2025",entityCode:"0140",entity:"T-US",start:"2026-07-20",end:"2026-07-24",area1:"Indirect Expenses",area2:"Order Entry & Sales Forecasting",area3:"Instrument Warranty Replacement",location:"Raleigh",status:"Planned",report:"Draft sent"},
      {id:3,lastAudited:"2024",entityCode:"0170",entity:"T-UK",start:"2026-03-11",end:"2026-03-13",area1:"Indirect Expenses",area2:"Order Entry & Sales Forecasting",area3:"Instrument Warranty Replacement",location:"London",status:"Report Final",report:"Draft, CFO, Group, Audit Com., EY"}
    ],
    fnd:[
      {id:1,year:2025,entity:"T-UK",area:"Segregation of Duties (SoD)",name:"Segregation of Duties – PO & Goods Receipt",finding:"Several occurrences where the same user created a PO and performed the goods receipt.",severity:"Medium",action:"",auditee:"Paul Noble, T-UK",due:"2025-02-28",status:"Closed"},
      {id:2,year:2025,entity:"T-CH",area:"Financial Reporting",name:"Goods received not invoiced",finding:"Over 4000 uncleared positions from 2014–2023, ~CHF 1m balance. Repeat finding.",severity:"High",action:"",auditee:"Patrick Bieri, T-TR",due:"2025-06-30",status:"Closed"},
      {id:3,year:2025,entity:"T-TR",area:"Delegation of Authority (DoA)",name:"End-of-Life Scrapping",finding:"CHF 98k of scrapping not approved in accordance with DoA. M9/M10 milestones skipped.",severity:"High",action:"",auditee:"Rafaela Truffer, T-TR",due:"2025-06-30",status:"Closed"},
      {id:4,year:2025,entity:"T-US",area:"Financial Reporting",name:"Unreported Sales Tax",finding:"Sales tax collected but not reported/paid in some jurisdictions. Amounts <10k USD.",severity:"High",action:"",auditee:"Joe Fischer, T-US",due:"2025-06-30",status:"Closed"},
      {id:5,year:2025,entity:"T-CN",area:"Financial Reporting",name:"Missing Revenue Recognition Control",finding:"T-117 revenue recognition control for complex instruments not performed.",severity:"Medium",action:"",auditee:"Cathy Chen, T-CN",due:"2025-06-30",status:"Closed"}
    ]
  };
}

/* ============================================================
   STATE
   ============================================================ */
var S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!S || !Array.isArray(S.fnd)) S = seed();

function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

/* ============================================================
   HELPERS
   ============================================================ */
function $(s,r){ return (r||document).querySelector(s); }
function esc(t){
  return String(t==null?"":t).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function parseDate(s){
  if(!s) return null;
  if(s instanceof Date) return s;
  var str = String(s).trim();
  // ISO date
  var m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return new Date(+m[1], +m[2]-1, +m[3]);
  // dd.mm.yyyy or dd/mm/yyyy
  m = str.match(/^(\d{1,2})[\.\/](\d{1,2})[\.\/](\d{4})/);
  if(m) return new Date(+m[3], +m[2]-1, +m[1]);
  var d = new Date(str);
  return isNaN(d) ? null : d;
}
var TODAY = new Date(); TODAY.setHours(0,0,0,0);
function iso(d){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function fmt(s){
  var d = parseDate(s);
  return d ? d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}) : "–";
}
function nid(arr){
  return arr.reduce(function(m,x){ return Math.max(m, x.id||0); }, 0) + 1;
}
function toast(m){
  var t = $("#toast");
  t.textContent = m;
  t.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(function(){ t.classList.remove("show"); }, 2600);
}
function isOverdue(f){
  if(f.status === "Closed") return false;
  var d = parseDate(f.due);
  return d && d < TODAY;
}
function normStatus(v){
  if(!v) return "Open";
  var s = String(v).trim().toLowerCase();
  if(s === "closed" || s === "close" || s === "yes") return "Closed";
  if(s === "open") return "Open";
  if(s.indexOf("in") === 0 || s === "ongoing" || s.indexOf("progress") !== -1) return "In Progress";
  return "Open";
}
function normSev(v){
  if(!v) return "Medium";
  var s = String(v).trim().toLowerCase();
  if(s === "high" || s === "critical") return "High";
  if(s === "low") return "Low";
  return "Medium";
}
function sevClass(s){ return s === "High" ? "High" : s === "Low" ? "Low" : "Medium"; }
function statClass(s){ return s === "Closed" ? "Closed" : s === "In Progress" ? "InProgress" : "Open"; }

/* ============================================================
   STATS
   ============================================================ */
function stats(){
  var open = S.fnd.filter(function(f){ return f.status !== "Closed"; });
  var od = open.filter(isOverdue);
  var hi = open.filter(function(f){ return f.severity === "High"; }).length;
  var ent = {};
  S.fnd.forEach(function(f){ ent[f.entity] = 1; });
  return {
    open: open, od: od, hi: hi, total: S.fnd.length,
    entities: Object.keys(ent).length
  };
}

/* ============================================================
   VIEWS
   ============================================================ */
var view = "dashboard";
var filt = { year:"All", entity:"All", sev:"All", status:"All", q:"" };

var VIEWS = {
  dashboard: ["Dashboard", function(){ return dash(); }],
  findings: ["Findings", function(){ return fnds(); }],
  engagements: ["Engagement tracker", function(){ return engs(); }],
  entities: ["Entities", function(){ return ents(); }],
  reports: ["Reports", function(){ return reps(); }]
};

function pageHead(title, sub, extra){
  return '<div class="head"><div><h1>'+title+'</h1><p>'+sub+'</p></div><div class="btns">'+(extra||"")+'</div></div>';
}
function kpi(v, l, warn){
  return '<div class="card kpi'+(warn?' warn':'')+'"><b>'+v+'</b><span>'+l+'</span></div>';
}
function subline(a, b){
  return '<b>'+esc(a)+'</b><span class="sub">'+esc(b)+'</span>';
}
function table(headers, rows, emptyMsg){
  var head = '<tr>'+headers.map(function(h){ return '<th>'+h+'</th>'; }).join('')+'</tr>';
  var body = rows.length ? rows.join('') : '<tr><td colspan="'+headers.length+'" class="empty">'+emptyMsg+'</td></tr>';
  return '<div class="card tbl"><table><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div>';
}
function row(editKey, cells){
  return '<tr class="click" data-ed="'+editKey+'" tabindex="0">'+cells.map(function(c){ return '<td>'+c+'</td>'; }).join('')+'</tr>';
}
function bars(list){
  var max = Math.max.apply(null, [1].concat(list.map(function(x){ return x[1]; })));
  return list.map(function(x){
    return '<div class="b"><span class="n" title="'+esc(x[0])+'">'+esc(x[0])+
      '</span><div class="t"><i style="width:'+(x[1]/max*100)+'%;background:'+x[2]+'"></i></div><b>'+x[1]+'</b></div>';
  }).join('');
}

function dash(){
  var s = stats();
  var bySev = SEV.map(function(v){
    return [v, s.open.filter(function(f){ return f.severity === v; }).length,
      ({High:"var(--high)",Medium:"var(--med)",Low:"var(--low)"})[v]];
  });
  var byStat = FST.map(function(v){
    return [v, S.fnd.filter(function(f){ return f.status === v; }).length,
      ({Open:"var(--high)","In Progress":"var(--med)",Closed:"var(--ok)"})[v]];
  });
  var yearSet = {};
  S.fnd.forEach(function(f){ yearSet[f.year] = 1; });
  var byYear = Object.keys(yearSet).sort().map(function(y){
    return [String(y), S.fnd.filter(function(f){ return f.year == y; }).length, "var(--brand)"];
  });
  var entCount = {};
  S.fnd.forEach(function(f){ entCount[f.entity] = (entCount[f.entity]||0) + 1; });
  var byEntity = Object.keys(entCount).map(function(k){ return [k, entCount[k], "var(--brand)"]; })
    .sort(function(a,b){ return b[1]-a[1]; }).slice(0, 8);
  var overdue = S.fnd.filter(isOverdue)
    .sort(function(a,b){ return (parseDate(a.due)||0) - (parseDate(b.due)||0); }).slice(0, 8);

  var overdueHTML = overdue.map(function(f){
    return '<div class="item"><div>'+subline(f.name, f.entity+' · '+(f.auditee||''))+'</div>'+
      '<span class="pill '+sevClass(f.severity)+'">'+f.severity+'</span>'+
      '<span class="pill '+statClass(f.status)+'">'+f.status+'</span>'+
      '<span class="over">'+fmt(f.due)+'</span></div>';
  }).join('') || '<div class="empty">Nothing overdue.</div>';

  return pageHead("Dashboard", "Audit findings, engagements, and entities at a glance.",
    '<button class="btn sec" data-act="csv">Export CSV</button><button class="btn" data-new="fnd">New finding</button>')+
    '<div class="kpis">'+
      kpi(S.fnd.length, "Total findings")+
      kpi(s.open.length, "Open findings")+
      kpi(s.hi, "High severity open", s.hi)+
      kpi(s.od.length, "Overdue actions", s.od.length)+
      kpi(s.entities, "Entities with findings")+
      kpi(S.eng.length, "Engagements")+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><h2>Open findings by severity</h2>'+bars(bySev)+'</div>'+
      '<div class="card"><h2>Findings by status</h2>'+bars(byStat)+'</div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card"><h2>Findings by year</h2>'+bars(byYear)+'</div>'+
      '<div class="card"><h2>Top entities by findings</h2>'+bars(byEntity)+'</div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><h2>Overdue actions</h2>'+overdueHTML+'</div>';
}

function fnds(){
  var q = filt.q.toLowerCase();
  var list = S.fnd.filter(function(f){
    if(filt.year !== "All" && String(f.year) !== filt.year) return false;
    if(filt.entity !== "All" && f.entity !== filt.entity) return false;
    if(filt.sev !== "All" && f.severity !== filt.sev) return false;
    if(filt.status !== "All" && f.status !== filt.status) return false;
    if(q){
      var hay = ((f.name||"")+(f.finding||"")+(f.auditee||"")+(f.entity||"")).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  }).sort(function(a,b){
    var ca = a.status === "Closed" ? 1 : 0;
    var cb = b.status === "Closed" ? 1 : 0;
    if(ca !== cb) return ca - cb;
    var sa = SEV.indexOf(a.severity), sb = SEV.indexOf(b.severity);
    if(sa !== sb) return sa - sb;
    return (parseDate(a.due)||0) - (parseDate(b.due)||0);
  });

  var yearSet = {}, entSet = {};
  S.fnd.forEach(function(f){ yearSet[f.year] = 1; entSet[f.entity] = 1; });
  var years = Object.keys(yearSet).sort().reverse();
  var entities = Object.keys(entSet).sort();

  var toolBar = '<div class="tools">'+
    '<input id="q" type="search" placeholder="Search findings, auditee, entity" value="'+esc(filt.q)+'">'+
    '<select id="f-year"><option value="All">All years</option>'+
      years.map(function(y){ return '<option '+(filt.year==y?'selected':'')+'>'+y+'</option>'; }).join('')+
    '</select>'+
    '<select id="f-ent"><option value="All">All entities</option>'+
      entities.map(function(e){ return '<option '+(filt.entity===e?'selected':'')+'>'+esc(e)+'</option>'; }).join('')+
    '</select>'+
    '<select id="f-sev"><option value="All">All severities</option>'+
      SEV.map(function(s){ return '<option '+(filt.sev===s?'selected':'')+'>'+s+'</option>'; }).join('')+
    '</select>'+
    '<select id="f-st"><option value="All">All statuses</option>'+
      FST.map(function(s){ return '<option '+(filt.status===s?'selected':'')+'>'+s+'</option>'; }).join('')+
    '</select>'+
  '</div>';

  var rows = list.map(function(f){
    return row("fnd:"+f.id, [
      f.year,
      esc(f.entity),
      subline(f.name, f.finding && f.finding.length > 80 ? f.finding.slice(0,80)+"…" : (f.finding||"")),
      '<span class="pill '+sevClass(f.severity)+'">'+f.severity+'</span>',
      esc(f.auditee||"—"),
      '<span class="'+(isOverdue(f)?"over":"")+'">'+fmt(f.due)+'</span>',
      '<span class="pill '+statClass(f.status)+'">'+f.status+'</span>'
    ]);
  });

  return pageHead("Findings register", "Every finding with owner, due date, and status. Click a row to edit.",
    '<button class="btn sec" data-act="csv">Export CSV</button><button class="btn" data-new="fnd">New finding</button>')+
    toolBar+
    table(["Year","Entity","Finding","Severity","Auditee","Due","Status"], rows, "No findings match.");
}

function engs(){
  var list = S.eng.slice().sort(function(a,b){
    return (parseDate(a.start)||0) - (parseDate(b.start)||0);
  });
  var rows = list.map(function(e){
    var n = S.fnd.filter(function(f){ return f.entity === e.entity; }).length;
    var area = e.area1 + (e.area2?" · "+e.area2:"") + (e.area3?" · "+e.area3:"");
    return row("eng:"+e.id, [

      '<td>'+esc(f.auditee||"")+'</td>'+

      '<th>Year</th><th>Entity</th><th>Finding</th><th>Severity</th><th>Auditee</th><th>Due</th><th>Status</th>'+

function openImport(){
  var dlg = $("#dlg");
  dlg.innerHTML = '<h2>Import from Excel</h2>'+
    '<div class="import-hint">Copy rows from your Excel sheet (including headers), paste below, then choose the sheet type. Column names are matched loosely.</div>'+
    '<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)">Sheet type'+
      '<select id="imp-kind">'+
        '<option value="fnd">Findings (Audit Findings Tracker)</option>'+
        '<option value="eng">Engagements (Audit Engagement Tracker)</option>'+
        '<option value="ent">Entities (Audit Areas &amp; Entities)</option>'+
      '</select>'+
    '</label>'+
    '<label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);margin-top:10px">Paste rows'+
      '<textarea id="imp-text" rows="12" style="font-family:monospace;font-size:12px" '+
      'placeholder="YEAR&#9;ENTITY&#9;AUDIT AREA&#9;NAME&#9;FINDINGS&#9;SEVERITY&#9;AGREED ACTIONS&#9;RESPONSIBLE AUDITEE&#9;TARGET DATE&#9;STATUS"></textarea>'+
    '</label>'+
    '<div class="acts"><button class="btn sec" id="imp-x">Cancel</button><button class="btn" id="imp-go">Import</button></div>';
  $("#imp-x", dlg).onclick = function(){ dlg.close(); };
  $("#imp-go", dlg).onclick = function(){
    var kind = $("#imp-kind", dlg).value;
    var text = $("#imp-text", dlg).value.trim();
    if(!text){ toast("Nothing to import"); return; }
    try {
      var count = importText(kind, text);
      dlg.close();
      save();
      render();
      toast("Imported "+count+" rows");
    } catch(err) {
      console.error(err);
      toast("Import failed — check console");
    }
  };
  dlg.showModal();
}

function splitRows(text){
  var lines = text.split(/\r?\n/).filter(function(l){ return l.trim() !== ""; });
  return lines.map(function(l){
    if(l.indexOf("\t") !== -1){
      return l.split("\t").map(function(c){ return c.trim(); });
    }
    // CSV fallback
    var out = [], cur = "", inQ = false;
    for(var i=0;i<l.length;i++){
      var c = l[i];
      if(c === '"'){
        if(inQ && l[i+1] === '"'){ cur += '"'; i++; }
        else { inQ = !inQ; }
      } else if(c === "," && !inQ){
        out.push(cur); cur = "";
      } else {
        cur += c;
      }
    }
    out.push(cur);
    return out.map(function(x){ return x.trim(); });
  });
}

function normaliseHeader(h){
  return String(h||"").toLowerCase()
    .replace(/[^a-z0-9]+/g,"_")
    .replace(/^_|_$/g,"");
}

function importText(kind, text){
  var rows = splitRows(text);
  if(rows.length < 2) throw new Error("Need a header row + data");
  var header = rows[0].map(normaliseHeader);
  var data = rows.slice(1);

  function idx(){
    var wants = Array.prototype.slice.call(arguments);
    for(var i=0;i<header.length;i++){
      for(var j=0;j<wants.length;j++){
        if(header[i] === wants[j] || header[i].indexOf(wants[j]) !== -1) return i;
      }
    }
    return -1;
  }
  function val(r, i){
    return i >= 0 && i < r.length ? r[i] : "";
  }

  if(kind === "fnd"){
    var cYear = idx("year"),
        cEnt = idx("entity"),
        cArea = idx("audit_area","area"),
        cName = idx("name","finding_name","title"),
        cFind = idx("findings","finding_description","description"),
        cSev = idx("severity"),
        cAct = idx("agreed_actions","action","recommendation"),
        cAud = idx("responsible_auditee","auditee","owner"),
        cDue = idx("target_date","due","due_date"),
        cSt = idx("status");

    var added = 0;
    data.forEach(function(r){
      var name = val(r, cName) || val(r, cFind);
      if(!name) return;
      var f = {
        id: nid(S.fnd),
        year: parseInt(val(r, cYear), 10) || new Date().getFullYear(),
        entity: val(r, cEnt) || "",
        area: val(r, cArea) || "",
        name: name,
        finding: val(r, cFind) || "",
        severity: normSev(val(r, cSev)),
        action: val(r, cAct) || "",
        auditee: val(r, cAud) || "",
        due: parseDate(val(r, cDue)) ? iso(parseDate(val(r, cDue))) : "",
        status: normStatus(val(r, cSt))
      };
      S.fnd.push(f);
      // auto-add entity
      if(f.entity && !S.ent.some(function(e){ return e.short === f.entity; })){
        S.ent.push({id:nid(S.ent), code:"", name:f.entity, short:f.entity});
      }
      added++;
    });
    return added;
  }

  if(kind === "eng"){
    var eLast = idx("last_audited","last"),
        eCode = idx("entity_code","code"),
        eEnt = idx("entity"),
        eStart = idx("planned_start","start"),
        eEnd = idx("planned_end","end"),
        eOnSite = idx("on_site","onsite"),
        eA1 = idx("area_1","area1"),
        eA2 = idx("area_2","area2"),
        eA3 = idx("area_3","area3"),
        eLoc = idx("location"),
        eSt = idx("status"),
        eRep = idx("report","draft_report","comments");

    var addedE = 0;
    data.forEach(function(r){
      var ent = val(r, eEnt);
      if(!ent) return;
      S.eng.push({
        id: nid(S.eng),
        lastAudited: val(r, eLast) || "",
        entityCode: val(r, eCode) || "",
        entity: ent,
        start: parseDate(val(r, eStart)) ? iso(parseDate(val(r, eStart))) : "",
        end: parseDate(val(r, eEnd)) ? iso(parseDate(val(r, eEnd))) : "",
        area1: val(r, eA1) || "",
        area2: val(r, eA2) || "",
        area3: val(r, eA3) || "",
        location: val(r, eLoc) || "",
        status: val(r, eSt) || "Planned",
        report: val(r, eRep) || ""
      });
      if(ent && !S.ent.some(function(e){ return e.short === ent; })){
        S.ent.push({id:nid(S.ent), code:val(r,eCode)||"", name:ent, short:ent});
      }
      addedE++;
    });
    return addedE;
  }

  if(kind === "ent"){
    var nCode = idx("code"),
        nName = idx("entities","entity","name");
    var addedN = 0;
    data.forEach(function(r){
      var code = val(r, nCode), name = val(r, nName);
      if(!name && !code) return;
      if(name && S.ent.some(function(e){ return e.name === name; })) return;
      S.ent.push({id:nid(S.ent), code:code||"", name:name||code, short:code||name});
      addedN++;
    });
    return addedN;
  }

  throw new Error("Unknown sheet type");
}

var DEFAULTS = {
  fnd: function(){
    return {year:new Date().getFullYear(), entity:"", area:"", name:"", finding:"",
      severity:"Medium", action:"", auditee:"", due:"", status:"Open"};
  },
  eng: function(){
    return {entity:"", entityCode:"", lastAudited:"", start:iso(TODAY), end:iso(TODAY),
      location:"", status:"Planned", area1:"", area2:"", area3:"", report:""};
  },
  ent: function(){
    return {code:"", name:"", short:""};
  }
};

function openForm(kind, id){
  var form = FORMS[kind];
  if(!form) return;
  var list = S[form.key];
  var cur = id ? list.find(function(x){ return x.id == id; }) : null;
  var isNew = !cur;
  var item = cur ? JSON.parse(JSON.stringify(cur)) : DEFAULTS[kind]();

  var dlg = $("#dlg");
  var fieldsHTML = form.fields.map(function(f){
    var key = f[0], label = f[1], type = f[2], options = f[3], wide = f[4];
    var v = item[key] != null ? item[key] : "";
    var ctrl;
    if(type === "sel"){
      ctrl = '<select data-k="'+key+'">'+options.map(function(o){
        return '<option '+(String(o)===String(v)?'selected':'')+'>'+esc(o)+'</option>';
      }).join('')+'</select>';
    } else if(type === "area"){
      ctrl = '<textarea data-k="'+key+'" rows="3">'+esc(v)+'</textarea>';
    } else {
      ctrl = '<input data-k="'+key+'" type="'+(type==="num"?"number":type==="date"?"date":"text")+'" value="'+esc(v)+'">';
    }
    return '<label class="'+(wide?'w':'')+'">'+label+ctrl+'</label>';
  }).join('');

  dlg.innerHTML = '<h2>'+(isNew?'New':'Edit')+' '+form.title+'</h2>'+
    '<div class="f">'+fieldsHTML+'</div>'+
    '<div class="acts">'+
      (isNew?'':'<button class="btn sec" id="del" style="margin-right:auto;color:var(--crit)">Delete</button>')+
      '<button class="btn sec" id="x">Cancel</button>'+
      '<button class="btn" id="ok">Save</button>'+
    '</div>';

  $("#x", dlg).onclick = function(){ dlg.close(); };

  var del = $("#del", dlg);
  if(del){
    del.onclick = function(){
      if(!confirm("Delete this "+form.title+"?")) return;
      var idx = list.indexOf(cur);
      if(idx >= 0) list.splice(idx, 1);
      save(); dlg.close(); render(); toast("Deleted");
    };
  }

  $("#ok", dlg).onclick = function(){
    var updated = {};
    form.fields.forEach(function(f){
      var key = f[0], type = f[2];
      var el = $('[data-k="'+key+'"]', dlg);
      var v = el.value;
      if(type === "num") v = v === "" ? "" : +v;
      updated[key] = v;
    });
    // required check (first field)
    var first = form.fields[0][0];
    if(!String(updated[first]||"").trim()){
      toast("Please fill in "+form.fields[0][1]);
      return;
    }
    Object.assign(item, updated);
    if(isNew){
      item.id = nid(list);
      list.push(item);
    }
    save(); dlg.close(); render(); toast("Saved");
  };

  dlg.showModal();
  var firstInput = $("[data-k]", dlg);
  if(firstInput) firstInput.focus();
}

/* ============================================================
   EXPORT
   ============================================================ */
function exportCSV(){
  var rows = [["Year","Entity","Audit area","Finding","Severity","Auditee","Due","Status","Agreed actions"]];
  S.fnd.forEach(function(f){
    rows.push([f.year, f.entity, f.area||"", f.name||"", f.severity||"",
      f.auditee||"", f.due||"", f.status||"", f.action||""]);
  });
  var csv = rows.map(function(r){
    return r.map(function(c){
      return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';
    }).join(',');
  }).join('\n');
  download(new Blob([csv],{type:"text/csv"}), "findings-"+iso(TODAY)+".csv");
}

function download(blob, name){
  var url = URL.createObjectURL(blob);
  var a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}

function resetAll(){
  if(!confirm("Replace all data with the small sample set?\n\nExport your current data to CSV first if you need it.")) return;
  S = seed();
  save(); render(); toast("Sample data restored");
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  var hash = location.hash.replace("#","") || "dashboard";
  view = VIEWS[hash] ? hash : "dashboard";

  var nav = $("#nav");
  var open = S.fnd.filter(function(f){ return f.status !== "Closed"; }).length;
  var counts = {findings: open, engagements: S.eng.length, entities: S.ent.length};
  nav.innerHTML = Object.keys(VIEWS).map(function(k){
    var n = counts[k];
    return '<a href="#'+k+'" class="'+(k===view?'on':'')+'">'+VIEWS[k][0]+
      (n!=null?'<small>'+n+'</small>':'')+'</a>';
  }).join('');

  $("#main").innerHTML = VIEWS[view][1]();

  // live search
  var q = $("#q");
  if(q){
    q.addEventListener("input", function(){
      filt.q = this.value;
      var start = this.selectionStart;
      render();
      var nq = $("#q");
      if(nq){ nq.focus(); nq.setSelectionRange(start, start); }
    });
  }
  // filters
  bindFilter("#f-year", "year");
  bindFilter("#f-ent", "entity");
  bindFilter("#f-sev", "sev");
  bindFilter("#f-st", "status");
}

function bindFilter(sel, key){
  var el = $(sel);
  if(!el) return;
  el.addEventListener("change", function(){
    filt[key] = this.value;
    render();
  });
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("click", function(ev){
  var t = ev.target.closest("[data-ed],[data-new],[data-act]");
  if(!t) return;
  var a = t.dataset;
  if(a.ed){
    var parts = a.ed.split(":");
    openForm(parts[0], parts[1]);
  } else if(a.new){
    openForm(a.new, null);
  } else if(a.act){
    if(a.act === "csv") exportCSV();
    else if(a.act === "print-ent") doPrint("ent");
    else if(a.act === "print-year") doPrint("year");
  }
});

document.addEventListener("keydown", function(ev){
  if(ev.key === "Enter" && ev.target.matches && ev.target.matches("tr.click")){
    ev.target.click();
  }
});

$("#import-btn").onclick = openImport;
$("#settings").onclick = openSettings;
$("#reset").onclick = resetAll;

window.addEventListener("hashchange", render);

/* ============================================================
   START
   ============================================================ */
render();

})();
