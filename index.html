<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auditline — Internal Audit Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;box-sizing:border-box;
  --bg:#edf1f4;--surf:#fff;--ink:#14202b;--mute:#5c6b78;--line:#dbe2e8;
  --brand:#0f5c63;--soft:#d9eded;--on:#fff;
  --crit:#b3261e;--high:#d9731a;--med:#b8920f;--low:#2f8a63;--ok:#2f8a63;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 6px 20px -8px rgba(20,32,43,.12)
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0d1418;--surf:#151f25;--ink:#e6edf1;--mute:#93a3ae;
  --line:#26343d;--brand:#4fb3ba;--soft:#173a3e;--on:#071418;
  --crit:#ff7b72;--high:#f0a050;--med:#e3c14d;--low:#5fcf9d;--ok:#5fcf9d;
  --shadow:0 1px 2px rgba(0,0,0,.4)
}}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:700 20px "Bricolage Grotesque",sans-serif}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo i::after{content:"";width:10px;height:10px;border:2.5px solid var(--on);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
nav small{background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute);margin-top:6px}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1320px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:28px}.head p{margin:2px 0 0;color:var(--mute);max-width:640px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:9px 15px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:14px}
.kpi b{display:block;font:700 32px/1.1 "Bricolage Grotesque",sans-serif}
.kpi span,.sub{color:var(--mute);font-size:13px}.sub{display:block}
.kpi.warn b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;margin-top:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:14px}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}
.Open{color:var(--high)}.InProgress{color:var(--med)}.Closed{color:var(--ok)}
.over{color:var(--crit);font-weight:600}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}.item:first-of-type{border-top:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select,textarea{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
textarea{resize:vertical}.tools input{max-width:280px}.tools select{max-width:200px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--mute)}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.tbl{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:820px}
th{text-align:left;font-weight:600;font-size:12.5px;color:var(--mute);padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top;font-size:14px}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.stat{background:var(--bg);border-radius:20px;padding:3px 12px;font-size:12px;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surf);color:var(--ink);padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,24,.55)}dialog h2{margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}.f .w{grid-column:1/-1}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;position:sticky;bottom:0;background:var(--surf);padding-top:12px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100}
.toast.show{opacity:1}
.b{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:13px}
.b .n{width:180px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b .t{flex:1;height:10px;background:var(--bg);border-radius:6px;overflow:hidden}.b .t i{display:block;height:100%}
.mini{font-size:12px;color:var(--mute)}
.import-hint{background:var(--soft);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--brand);margin-bottom:12px}
@media(max-width:960px){.grid3{grid-template-columns:1fr}}
@media(max-width:860px){.app{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:5;overflow-x:auto}
.logo{padding:0 8px 0 0}.logo span,.spacer,aside .ghost{display:none}nav{display:flex;gap:4px;white-space:nowrap}nav small{display:none}
.grid2{grid-template-columns:1fr}}
@media print{@page{margin:14mm}aside,.btns,.tools,.toast,.import-hint{display:none!important}
.app{display:block}main{padding:0;max-width:none}body{background:#fff}.card{box-shadow:none;break-inside:avoid}.pb{break-after:page}.tbl{overflow:visible}table{min-width:0}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span>Auditline</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="import-btn">Import from Excel</button>
  <button class="ghost" id="settings">Settings</button>
  <button class="ghost" id="reset">Reset data</button>
</aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";

const KEY="auditline-tecan-v1";
const SEV=["High","Medium","Low"];
const FST=["Open","In Progress","Closed"];
const EST=["Planned","In Progress","Report Draft","Report Final","Overdue"];
const AREAS=[
  "Delegation of Authority (DoA)","Financial Reporting","Inventory Management",
  "Receivable and payable (incl. IC)","IT Asset Management & Data Security",
  "Segregation of Duties (SoD)","Security & Administrative Oversight",
  "Human Resources","Procurement Contracts","Order Entry & Sales Forecasting",
  "Pricing","Credit Management & Customer Payment Terms","Indirect Expenses",
  "Balance Sheet Review","Demo & Service Inventory","Instrument Warranty Replacement Process"
];

// Compact seed — 5 findings, 3 engagements, 5 entities. Real data via Import.
const seed=()=>({
meta:{orgName:"Tecan Group",currentUser:"Internal Audit",lastUpdated:new Date().toISOString()},
ent:[
  {id:1,code:"105",name:"Tecan Schweiz AG",short:"T-CH"},
  {id:2,code:"140",name:"Tecan US Inc.",short:"T-US"},
  {id:3,code:"170",name:"Tecan UK Ltd.",short:"T-UK"},
  {id:4,code:"280",name:"Tecan Trading AG",short:"T-TR"},
  {id:5,code:"360",name:"Tecan China",short:"T-CN"}
],
eng:[
  {id:1,lastAudited:"2025",entityCode:"0105",entity:"T-CH",start:"2026-04-13",end:"2026-04-30",onSite:"",area1:"Indirect Expenses",area2:"Balance Sheet Review",area3:"Credit Management & Customer Payment Terms",location:"CH",status:"Planned",draft:"",cfo:"",group:"",audcom:"",ey:"",comments:""},
  {id:2,lastAudited:"2025",entityCode:"0140",entity:"T-US",start:"2026-07-20",end:"2026-07-24",onSite:"",area1:"Indirect Expenses",area2:"Order Entry & Sales Forecasting",area3:"Instrument Warranty Replacement Process",location:"Raleigh",status:"Planned",draft:"x",cfo:"",group:"",audcom:"",ey:"",comments:""},
  {id:3,lastAudited:"2024",entityCode:"0170",entity:"T-UK",start:"2026-03-11",end:"2026-03-13",onSite:"",area1:"Indirect Expenses",area2:"Order Entry & Sales Forecasting",area3:"Instrument Warranty Replacement Process",location:"London",status:"Report Final",draft:"x",cfo:"x",group:"x",audcom:"x",ey:"x",comments:""}
],
fnd:[
  {id:1,year:2025,entity:"T-UK",area:"Segregation of Duties (SoD)",name:"Segregation of Duties – PO & Goods Receipt",finding:"Several occurrences where the same user created a PO and performed the goods receipt.",assessment:"",severity:"Medium",action:"",auditee:"Paul Noble, T-UK",due:"2025-02-28",status:"Closed"},
  {id:2,year:2025,entity:"T-CH",area:"Financial Reporting",name:"Goods received not invoiced",finding:"Over 4000 uncleared positions from 2014–2023, ~CHF 1m balance. Repeat finding.",assessment:"",severity:"High",action:"",auditee:"Patrick Bieri, T-TR",due:"2025-06-30",status:"Closed"},
  {id:3,year:2025,entity:"T-TR",area:"Delegation of Authority (DoA)",name:"End-of-Life Scrapping",finding:"CHF 98k of scrapping not approved in accordance with DoA. M9/M10 milestones skipped.",assessment:"",severity:"High",action:"",auditee:"Rafaela Truffer, T-TR",due:"2025-06-30",status:"Closed"},
  {id:4,year:2025,entity:"T-US",area:"Financial Reporting",name:"Unreported Sales Tax",finding:"Sales tax collected but not reported/paid in some jurisdictions. Amounts <10k USD.",assessment:"",severity:"High",action:"",auditee:"Joe Fischer, T-US",due:"2025-06-30",status:"Closed"},
  {id:5,year:2025,entity:"T-CN",area:"Financial Reporting",name:"Missing Revenue Recognition Control",finding:"T-117 revenue recognition control for complex instruments not performed.",assessment:"",severity:"Medium",action:"",auditee:"Cathy Chen, T-CN",due:"2025-06-30",status:"Closed"}
]});

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!Array.isArray(S.fnd))S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const $=(s,r)=>(r||document).querySelector(s);
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const d=s=>new Date(s+"T00:00:00");
const TODAY=new Date();TODAY.setHours(0,0,0,0);
const iso=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
const fmt=s=>s?d(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}):"–";
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2600)};
const over=f=>f.status!=="Closed"&&f.due&&d(f.due)<TODAY;
const age=f=>{if(!f.due)return 0;return Math.max(0,Math.round((TODAY-d(f.due))/864e5))};
const sevClass=s=>({High:"High",Medium:"Medium",Low:"Low"}[s]||"Medium");
const statClass=s=>({Open:"Open","In Progress":"InProgress",Closed:"Closed"}[s]||"Open");

// Normalise free-text status to one of FST
const normStatus=v=>{
  if(!v)return "Open";
  const s=String(v).trim().toLowerCase();
  if(s==="closed")return "Closed";
  if(s==="open")return "Open";
  if(s.startsWith("in")||s==="ongoing"||s.includes("progress"))return "In Progress";
  if(s==="yes")return "Closed";
  return "Open";
};

// Normalise free-text severity
const normSev=v=>{
  if(!v)return "Medium";
  const s=String(v).trim().toLowerCase();
  if(s==="high"||s==="critical")return "High";
  if(s==="low")return "Low";
  return "Medium";
};

function stats(){
  const open=S.fnd.filter(f=>f.status!=="Closed");
  const od=open.filter(over);
  const hi=open.filter(f=>f.severity==="High").length;
  const entitiesTouched=new Set(S.fnd.map(f=>f.entity)).size;
  return{open,od,hi,total:S.fnd.length,entitiesTouched};
}

let view="dashboard";
let filt={year:"All",entity:"All",sev:"All",status:"All",q:""};

const V={
  dashboard:["Dashboard",()=>dash()],
  findings:["Findings",()=>fnds()],
  engagements:["Engagement tracker",()=>engs()],
  entities:["Entities",()=>ents()],
  reports:["Reports",()=>reps()]
};

const head=(t,s,extra="")=>`<div class="head"><div><h1>${t}</h1><p>${s}</p></div><div class="btns">${extra}</div></div>`;
const kpi=(v,l,w)=>`<div class="card kpi${w?" warn":""}"><b>${v}</b><span>${l}</span></div>`;
const sub=(a,b)=>`<b>${esc(a)}</b><span class="sub">${esc(b)}</span>`;
const tr=(ed,c)=>`<tr class="click" data-ed="${ed}" tabindex="0">${c.map(x=>`<td>${x}</td>`).join("")}</tr>`;
const tbl=(h,r,m)=>`<div class="card tbl"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr></thead><tbody>${r.join("")||`<tr><td colspan="${h.length}" class="empty">${m}</td></tr>`}</tbody></table></div>`;
const bars=a=>{const m=Math.max(1,...a.map(x=>x[1]));return a.map(([l,v,c])=>`<div class="b"><span class="n" title="${esc(l)}">${esc(l)}</span><div class="t"><i style="width:${v/m*100}%;background:${c}"></i></div><b>${v}</b></div>`).join("")};

const entByShort=sh=>S.ent.find(e=>e.short===sh);

function dash(){
  const s=stats();
  const bySev=SEV.map(v=>[v,s.open.filter(f=>f.severity===v).length,({High:"var(--high)",Medium:"var(--med)",Low:"var(--low)"})[v]]);
  const byStat=FST.map(v=>[v,S.fnd.filter(f=>f.status===v).length,({Open:"var(--high)","In Progress":"var(--med)",Closed:"var(--ok)"})[v]]);
  const byYear=[...new Set(S.fnd.map(f=>f.year))].sort().map(y=>[String(y),S.fnd.filter(f=>f.year==y).length,"var(--brand)"]);
  const byEntity=Object.entries(S.fnd.reduce((a,f)=>{a[f.entity]=(a[f.entity]||0)+1;return a},{})).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,v])=>[k,v,"var(--brand)"]);
  const overdue=S.fnd.filter(over).sort((a,b)=>d(a.due)-d(b.due)).slice(0,8);

  return head("Dashboard","Audit findings, engagements, and entities at a glance.",
    `<button class="btn sec" data-act="xlsx">Export Excel</button><button class="btn" data-new="fnd">New finding</button>`)+
  `<div class="kpis">${kpi(S.fnd.length,"Total findings")}${kpi(s.open.length,"Open findings")}${kpi(s.hi,"High severity open",s.hi)}${kpi(s.od.length,"Overdue actions",s.od.length)}${kpi(s.entitiesTouched,"Entities with findings")}${kpi(S.eng.length,"Engagements")}</div>
   <div class="grid2">
     <div class="card"><h2>Open findings by severity</h2>${bars(bySev)}</div>
     <div class="card"><h2>Findings by status</h2>${bars(byStat)}</div>
   </div>
   <div class="grid2">
     <div class="card"><h2>Findings by year</h2>${bars(byYear)}</div>
     <div class="card"><h2>Top entities by findings</h2>${bars(byEntity)}</div>
   </div>
   <div class="card" style="margin-top:14px"><h2>Overdue actions</h2>
     ${overdue.map(f=>`<div class="item"><div>${sub(f.name,f.entity+" · "+f.auditee)}</div><span class="pill ${sevClass(f.severity)}">${f.severity}</span><span class="pill ${statClass(f.status)}">${f.status}</span><span class="over">${fmt(f.due)}</span></div>`).join("")||'<div class="empty">Nothing overdue.</div>'}
   </div>`;
}

function fnds(){
  const q=filt.q.toLowerCase();
  const list=S.fnd.filter(f=>
    (filt.year==="All"||String(f.year)===filt.year)&&
    (filt.entity==="All"||f.entity===filt.entity)&&
    (filt.sev==="All"||f.severity===filt.sev)&&
    (filt.status==="All"||f.status===filt.status)&&
    (!q||((f.name||"")+(f.finding||"")+(f.auditee||"")+(f.entity||"")).toLowerCase().includes(q))
  ).sort((a,b)=>(a.status==="Closed")-(b.status==="Closed")||SEV.indexOf(a.severity)-SEV.indexOf(b.severity)||(d(a.due)-d(b.due)));

  const years=[...new Set(S.fnd.map(f=>f.year))].sort().reverse();
  const entities=[...new Set(S.fnd.map(f=>f.entity))].sort();

  return head("Findings register","Every finding with owner, due date, and status. Click a row to edit.",
    `<button class="btn sec" data-act="csv">Export CSV</button><button class="btn" data-new="fnd">New finding</button>`)+
  `<div class="tools">
    <input id="q" type="search" placeholder="Search findings, auditee, entity" value="${esc(filt.q)}">
    <select id="f-year"><option value="All">All years</option>${years.map(y=>`<option ${filt.year==y?"selected":""}>${y}</option>`).join("")}</select>
    <select id="f-ent"><option value="All">All entities</option>${entities.map(e=>`<option ${filt.entity===e?"selected":""}>${e}</option>`).join("")}</select>
    <select id="f-sev"><option value="All">All severities</option>${SEV.map(s=>`<option ${filt.sev===s?"selected":""}>${s}</option>`).join("")}</select>
    <select id="f-st"><option value="All">All statuses</option>${FST.map(s=>`<option ${filt.status===s?"selected":""}>${s}</option>`).join("")}</select>
  </div>`+
  tbl(["Year","Entity","Finding","Severity","Auditee","Due","Status"],list.map(f=>tr("fnd:"+f.id,[
    f.year,esc(f.entity),sub(f.name,f.finding?f.finding.slice(0,80)+(f.finding.length>80?"…":""):""),
    `<span class="pill ${sevClass(f.severity)}">${f.severity}</span>`,
    esc(f.auditee||"—"),
    `<span class="${over(f)?"over":""}">${fmt(f.due)}</span>`,
    `<span class="pill ${statClass(f.status)}">${f.status}</span>`
  ])),"No findings match.");
}

function engs(){
  const list=[...S.eng].sort((a,b)=>d(a.start)-d(b.start));
  return head("Engagement tracker","2026 audit plan — status and report milestones.",
    `<button class="btn sec" data-act="xlsx">Export Excel</button><button class="btn" data-new="eng">New engagement</button>`)+
  tbl(["Entity","Code","Window","Area","Location","Status","Report"],list.map(e=>{
    const findingCount=S.fnd.filter(f=>f.entity===e.entity).length;
    const reports=[["draft","Draft"],["cfo","CFO"],["group","Group"],["audcom","Audit Com."],["ey","EY"]]
      .filter(([k])=>e[k]).map(([,l])=>l).join(", ")||"—";
    return tr("eng:"+e.id,[
      sub(e.entity,entByShort(e.entity)?.name||""),
      esc(e.entityCode),
      fmt(e.start)+" – "+fmt(e.end),
      esc(e.area1+(e.area2?" · "+e.area2:"")+(e.area3?" · "+e.area3:"")),
      esc(e.location),
      `<span class="stat">${esc(e.status)}</span> <span class="mini">${findingCount} findings</span>`,
      `<span class="mini">${esc(reports)}</span>`
    ]);
  }),"No engagements yet.");
}

function ents(){
  const withF=S.ent.map(e=>({e,n:S.fnd.filter(f=>f.entity===e.short).length,open:S.fnd.filter(f=>f.entity===e.short&&f.status!=="Closed").length}));
  return head("Entities","Audit universe with finding counts.","<button class=\"btn\" data-new=\"ent\">New entity</button>")+
  tbl(["Code","Entity","Short","Findings","Open"],withF.map(({e,n,open})=>tr("ent:"+e.id,[e.code,esc(e.name),esc(e.short),n,open])),"No entities yet.");
}

function reps(){
  const entities=[...new Set(S.fnd.map(f=>f.entity))].sort();
  const years=[...new Set(S.fnd.map(f=>f.year))].sort().reverse();
  return head("Reports","Print a findings report per entity or per year.",
    `<button class="btn sec" data-act="print-ent">Print entity report</button><button class="btn sec" data-act="print-year">Print year report</button>`)+
  `<div class="card"><h2>Entity report</h2>
     <div class="tools"><select id="rep-ent"><option value="">— choose entity —</option>${entities.map(e=>`<option>${e}</option>`).join("")}</select></div>
     <p class="sub">Select an entity, then click "Print entity report". The browser print dialog lets you save as PDF.</p>
   </div>
   <div class="card" style="margin-top:14px"><h2>Year report</h2>
     <div class="tools"><select id="rep-year"><option value="">— choose year —</option>${years.map(y=>`<option>${y}</option>`).join("")}</select></div>
     <p class="sub">Select a year, then click "Print year report".</p>
   </div>`;
}

function doPrint(kind){
  const val=$(kind==="ent"?"#rep-ent":"#rep-year").value;
  if(!val){toast("Choose a "+kind+" first");return}
  const rows=S.fnd.filter(f=>kind==="ent"?f.entity===val:f.year==val);
  const title=kind==="ent"?`Findings — ${val}`:`Findings — ${val}`;
  const main=$("#main");
  const prev=main.innerHTML;
  main.innerHTML=`<div class="pb"><h1>${esc(title)}</h1><p class="sub">Generated ${fmt(iso(TODAY))} · ${rows.length} findings</p></div>`+
    tbl(["Year","Entity","Finding","Severity","Auditee","Due","Status"],rows.map(f=>`<tr>${[
      f.year,esc(f.entity),sub(f.name,f.finding),
      `<span class="pill ${sevClass(f.severity)}">${f.severity}</span>`,
      esc(f.auditee),fmt(f.due),
      `<span class="pill ${statClass(f.status)}">${f.status}</span>`
    ].map(x=>`<td>${x}</td>`).join("")}</tr>`),"No findings.");
  const restore=()=>{main.innerHTML=prev;render()};
  addEventListener("afterprint",restore,{once:true});
  setTimeout(()=>{print();setTimeout(()=>{main.innerHTML=prev;render()},800)},150);
}

function openImport(){
  const dlg=$("#dlg");
  dlg.innerHTML=`<h2>Import from Excel</h2>
    <div class="import-hint">Copy rows from your Excel sheet (including headers), paste below, then choose which sheet it is. Column names are matched loosely.</div>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)">Sheet type
      <select id="imp-kind">
        <option value="fnd">Findings (Audit Findings Tracker)</option>
        <option value="eng">Engagements (Audit Engagement Tracker)</option>
        <option value="ent">Entities (Audit Areas &amp; Entities)</option>
      </select>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute);margin-top:10px">Paste rows
      <textarea id="imp-text" rows="10" placeholder="YEAR&#9;ENTITY&#9;AUDIT AREA&#9;NAME&#9;FINDINGS&#9;ASSESSMENT&#9;SEVERITY&#9;AGREED ACTIONS&#9;RESPONSIBLE AUDITEE&#9;TARGET DATE&#9;STATUS" style="font-family:monospace;font-size:12px"></textarea>
    </label>
    <div class="acts"><button class="btn sec" id="imp-x">Cancel</button><button class="btn" id="imp-go">Import</button></div>`;
  $("#imp-x",dlg).onclick=()=>dlg.close();
  $("#imp-go",dlg).onclick=()=>{
    const kind=$("#imp-kind",dlg).value;
    const text=$("#imp-text",dlg).value.trim();
    if(!text){toast("Nothing to import");return}
    try{
      const count=importText(kind,text);
      dlg.close();
      save();render();
      toast(`Imported ${count} rows`);
    }catch(err){console.error(err);toast("Import failed — see console")}
  };
  dlg.showModal();
}
