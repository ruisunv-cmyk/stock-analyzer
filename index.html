<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WavStrike · Personal Music Library</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #0f0f1a 100%);
            font-family: 'Inter', sans-serif;
            color: #ffffff;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .glass-card {
            background: rgba(18, 22, 40, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            border: 1px solid rgba(100, 108, 255, 0.25);
            padding: 28px;
            transition: all 0.3s ease;
        }

        .glass-card:hover {
            border-color: rgba(100, 108, 255, 0.5);
            box-shadow: 0 8px 32px rgba(100, 108, 255, 0.1);
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #a855f7, #6366f1, #3b82f6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge {
            background: rgba(100, 108, 255, 0.2);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            border: 1px solid rgba(100, 108, 255, 0.4);
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
            margin-bottom: 24px;
        }

        .now-playing {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
            align-items: center;
        }

        .album-art {
            width: 200px;
            height: 200px;
            border-radius: 24px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            box-shadow: 0 20px 35px -10px rgba(0,0,0,0.5);
        }

        .track-title {
            font-size: 28px;
            font-weight: 700;
            margin: 12px 0 8px;
            line-height: 1.2;
        }

        .artist-name {
            color: #a0aec0;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none;
            padding: 12px 28px;
            border-radius: 60px;
            font-weight: 600;
            color: white;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            margin-right: 12px;
        }

        .btn-outline {
            background: rgba(100, 108, 255, 0.15);
            border: 1px solid #6366f1;
            color: #a5b4fc;
            padding: 12px 24px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-outline:hover {
            background: rgba(100, 108, 255, 0.3);
        }

        .song-item {
            background: rgba(255,255,255,0.04);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .song-item:hover {
            background: rgba(100, 108, 255, 0.15);
            transform: translateX(5px);
        }

        .song-item.active {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.3), rgba(168, 85, 247, 0.3));
            border-left: 3px solid #6366f1;
        }

        .upload-area {
            border: 2px dashed rgba(100, 108, 255, 0.4);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-area:hover {
            border-color: #6366f1;
            background: rgba(99, 102, 241, 0.05);
        }

        .progress-bar {
            margin-top: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            height: 6px;
            overflow: hidden;
            cursor: pointer;
        }

        .progress-fill {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            height: 100%;
            width: 0%;
            transition: width 0.1s linear;
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 12px;
            opacity: 0.7;
        }

        .volume-slider {
            width: 100px;
            margin-left: 16px;
            vertical-align: middle;
        }

        .delete-btn {
            background: rgba(239, 68, 68, 0.2);
            border: none;
            color: #f87171;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 11px;
        }

        .delete-btn:hover {
            background: rgba(239, 68, 68, 0.4);
        }

        @media (max-width: 900px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            .now-playing {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="glass-card" style="margin-bottom: 24px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;">
            <div class="logo">◉ WAVSTRIKE · YOUR LIBRARY</div>
            <div class="badge">🎵 Offline Player · Upload MP3</div>
        </div>
    </div>

    <div class="grid-2">
        <!-- Now Playing Section -->
        <div class="glass-card">
            <div style="color: #a855f7; font-size: 12px; letter-spacing: 1px; margin-bottom: 20px;">🎧 NOW PLAYING</div>
            <div class="now-playing">
                <div class="album-art" id="albumArtDisplay">🎵</div>
                <div style="flex: 1;">
                    <div id="currentTrackName" class="track-title">No track selected</div>
                    <div id="currentTrackArtist" class="artist-name">Upload songs to start</div>
                    <div>
                        <button id="playPauseBtn" class="btn-primary">▶️ Play</button>
                        <button id="prevBtn" class="btn-outline">⏮️ Prev</button>
                        <button id="nextBtn" class="btn-outline">⏭️ Next</button>
                        <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="70">
                    </div>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="time-display">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Upload Area -->
        <div class="glass-card">
            <div style="color: #a855f7; font-size: 12px; letter-spacing: 1px; margin-bottom: 16px;">📤 UPLOAD MUSIC</div>
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 48px; margin-bottom: 12px;">🎵</div>
                <div style="font-weight: 600; margin-bottom: 8px;">Drop MP3 files here or click to upload</div>
                <div style="font-size: 12px; opacity: 0.6;">Supports: MP3, WAV, OGG (max 50MB per file)</div>
                <input type="file" id="fileInput" multiple accept=".mp3,.wav,.ogg,.m4a" style="display: none;">
            </div>
            <div id="uploadStatus" style="margin-top: 12px; font-size: 12px; color: #a5b4fc;"></div>
        </div>
    </div>

    <!-- Playlist Section -->
    <div class="glass-card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap;">
            <div style="color: #a855f7; font-size: 12px; letter-spacing: 1px;">📋 YOUR PLAYLIST</div>
            <div>
                <button id="clearAllBtn" class="delete-btn" style="background: rgba(239,68,68,0.15);">🗑️ Clear All</button>
                <span id="songCount" style="margin-left: 12px; font-size: 12px;">0 songs</span>
            </div>
        </div>
        <div id="playlistContainer" style="max-height: 400px; overflow-y: auto;">
            <div style="text-align: center; padding: 40px; opacity: 0.5;">
                No songs yet. Upload your first MP3 file!
            </div>
        </div>
    </div>
</div>

<script>
    // Music Library
    let playlist = []; // Array of { name, artist, url, duration, file }
    let currentIndex = 0;
    let isPlaying = false;
    
    // Audio element
    const audio = new Audio();
    
    // DOM elements
    const playPauseBtn = document.getElementById('playPauseBtn');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const currentTimeSpan = document.getElementById('currentTime');
    const totalTimeSpan = document.getElementById('totalTime');
    const currentTrackNameSpan = document.getElementById('currentTrackName');
    const currentTrackArtistSpan = document.getElementById('currentTrackArtist');
    const playlistContainer = document.getElementById('playlistContainer');
    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const uploadStatus = document.getElementById('uploadStatus');
    const songCountSpan = document.getElementById('songCount');
    const clearAllBtn = document.getElementById('clearAllBtn');
    const albumArtDisplay = document.getElementById('albumArtDisplay');
    
    // Load saved playlist from localStorage
    function loadPlaylistFromStorage() {
        const saved = localStorage.getItem('wavstrike_playlist');
        if (saved) {
            try {
                const songs = JSON.parse(saved);
                // Recreate object URLs
                songs.forEach(song => {
                    if (song.dataUrl) {
                        addSongToPlaylist(song.name, song.artist || 'Local file', song.dataUrl, song.duration);
                    }
                });
            } catch(e) { console.log('Error loading playlist'); }
        }
    }
    
    // Save playlist to localStorage (store data URLs)
    function savePlaylistToStorage() {
        const songsToSave = playlist.map(song => ({
            name: song.name,
            artist: song.artist,
            dataUrl: song.url,
            duration: song.duration
        }));
        localStorage.setItem('wavstrike_playlist', JSON.stringify(songsToSave));
    }
    
    // Add song to playlist
    function addSongToPlaylist(name, artist, url, duration) {
        playlist.push({
            name: name,
            artist: artist || 'Unknown Artist',
            url: url,
            duration: duration || 0
        });
        renderPlaylist();
        savePlaylistToStorage();
        updateSongCount();
        
        // If this is the first song, load it
        if (playlist.length === 1 && !audio.src) {
            loadSong(0);
        }
    }
    
    // Format seconds to MM:SS
    function formatTime(seconds) {
        if (isNaN(seconds)) return '0:00';
        const mins = Math.floor(seconds / 60);
        const secs = Math.floor(seconds % 60);
        return `${mins}:${secs.toString().padStart(2, '0')}`;
    }
    
    // Load song by index
    function loadSong(index) {
        if (index < 0 || index >= playlist.length) return;
        
        currentIndex = index;
        const song = playlist[currentIndex];
        audio.src = song.url;
        audio.load();
        
        currentTrackNameSpan.textContent = song.name;
        currentTrackArtistSpan.textContent = song.artist;
        albumArtDisplay.textContent = ['🎵', '🎶', '🎸', '🎹', '🎧'][Math.floor(Math.random() * 5)];
        
        // Update active state in playlist
        renderPlaylist();
        
        if (isPlaying) {
            audio.play().catch(e => console.log('Play error:', e));
        }
        
        // Update duration when loaded
        audio.addEventListener('loadedmetadata', () => {
            const duration = audio.duration;
            song.duration = duration;
            totalTimeSpan.textContent = formatTime(duration);
            savePlaylistToStorage();
        });
    }
    
    // Render playlist UI
    function renderPlaylist() {
        if (playlist.length === 0) {
            playlistContainer.innerHTML = '<div style="text-align: center; padding: 40px; opacity: 0.5;">No songs yet. Upload your first MP3 file!</div>';
            return;
        }
        
        playlistContainer.innerHTML = playlist.map((song, idx) => `
            <div class="song-item ${idx === currentIndex ? 'active' : ''}" onclick="playSongAtIndex(${idx})">
                <div style="flex: 1;">
                    <div style="font-weight: 600;">${escapeHtml(song.name)}</div>
                    <div style="font-size: 12px; opacity: 0.7;">${escapeHtml(song.artist)}</div>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <span style="font-size: 12px;">${formatTime(song.duration)}</span>
                    <button class="delete-btn" onclick="event.stopPropagation(); deleteSong(${idx})">Remove</button>
                </div>
            </div>
        `).join('');
    }
    
    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    window.playSongAtIndex = function(index) {
        if (index === currentIndex && audio.src) {
            togglePlayPause();
        } else {
            isPlaying = true;
            loadSong(index);
            audio.play().catch(e => console.log(e));
            playPauseBtn.textContent = '⏸️ Pause';
        }
    };
    
    function deleteSong(index) {
        // Revoke object URL to free memory
        if (playlist[index] && playlist[index].url && playlist[index].url.startsWith('blob:')) {
            URL.revokeObjectURL(playlist[index].url);
        }
        playlist.splice(index, 1);
        
        if (playlist.length === 0) {
            audio.pause();
            audio.src = '';
            currentTrackNameSpan.textContent = 'No track selected';
            currentTrackArtistSpan.textContent = 'Upload songs to start';
            albumArtDisplay.textContent = '🎵';
            isPlaying = false;
            playPauseBtn.textContent = '▶️ Play';
            currentIndex = 0;
        } else if (index <= currentIndex && currentIndex > 0) {
            currentIndex--;
            if (currentIndex >= 0) loadSong(currentIndex);
            else if (playlist.length > 0) loadSong(0);
        } else if (index === currentIndex && playlist.length > 0) {
            loadSong(Math.min(currentIndex, playlist.length - 1));
        }
        
        renderPlaylist();
        savePlaylistToStorage();
        updateSongCount();
    }
    
    function togglePlayPause() {
        if (!audio.src || playlist.length === 0) return;
        
        if (isPlaying) {
            audio.pause();
            playPauseBtn.textContent = '▶️ Play';
        } else {
            audio.play().catch(e => console.log('Play error:', e));
            playPauseBtn.textContent = '⏸️ Pause';
        }
        isPlaying = !isPlaying;
    }
    
    function nextSong() {
        if (playlist.length === 0) return;
        const nextIndex = (currentIndex + 1) % playlist.length;
        isPlaying = true;
        loadSong(nextIndex);
        audio.play();
        playPauseBtn.textContent = '⏸️ Pause';
    }
    
    function prevSong() {
        if (playlist.length === 0) return;
        const prevIndex = (currentIndex - 1 + playlist.length) % playlist.length;
        isPlaying = true;
        loadSong(prevIndex);
        audio.play();
        playPauseBtn.textContent = '⏸️ Pause';
    }
    
    function updateSongCount() {
        songCountSpan.textContent = `${playlist.length} song${playlist.length !== 1 ? 's' : ''}`;
    }
    
    function clearAllSongs() {
        if (confirm('Remove all songs from playlist? This cannot be undone.')) {
            // Revoke all blob URLs
            playlist.forEach(song => {
                if (song.url && song.url.startsWith('blob:')) URL.revokeObjectURL(song.url);
            });
            playlist = [];
            audio.pause();
            audio.src = '';
            currentTrackNameSpan.textContent = 'No track selected';
            currentTrackArtistSpan.textContent = 'Upload songs to start';
            isPlaying = false;
            playPauseBtn.textContent = '▶️ Play';
            currentIndex = 0;
            renderPlaylist();
            savePlaylistToStorage();
            updateSongCount();
        }
    }
    
    // Handle file upload
    function handleFiles(files) {
        const audioFiles = Array.from(files).filter(f => f.type.startsWith('audio/'));
        
        if (audioFiles.length === 0) {
            uploadStatus.textContent = '⚠️ No valid audio files found';
            return;
        }
        
        uploadStatus.textContent = `📥 Uploading ${audioFiles.length} file(s)...`;
        
        audioFiles.forEach(file => {
            const url = URL.createObjectURL(file);
            let fileName = file.name.replace(/\.[^/.]+$/, ''); // Remove extension
            // Try to parse "Artist - Title" format
            let artist = 'Local file';
            let title = fileName;
            if (fileName.includes(' - ')) {
                const parts = fileName.split(' - ');
                artist = parts[0];
                title = parts.slice(1).join(' - ');
            }
            
            addSongToPlaylist(title, artist, url, 0);
        });
        
        uploadStatus.textContent = `✅ Added ${audioFiles.length} song(s)!`;
        setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
    }
    
    // Event listeners
    playPauseBtn.onclick = togglePlayPause;
    nextBtn.onclick = nextSong;
    prevBtn.onclick = prevSong;
    clearAllBtn.onclick = clearAllSongs;
    
    volumeSlider.oninput = (e) => {
        audio.volume = e.target.value / 100;
    };
    audio.volume = 0.7;
    
    // Progress bar updates
    audio.ontimeupdate = () => {
        if (audio.duration) {
            const percent = (audio.currentTime / audio.duration) * 100;
            progressFill.style.width = `${percent}%`;
            currentTimeSpan.textContent = formatTime(audio.currentTime);
        }
    };
    
    audio.onended = () => {
        nextSong();
    };
    
    // Click on progress bar to seek
    progressBar.onclick = (e) => {
        if (audio.duration) {
            const rect = progressBar.getBoundingClientRect();
            const percent = (e.clientX - rect.left) / rect.width;
            audio.currentTime = percent * audio.duration;
        }
    };
    
    // Upload handlers
    uploadArea.onclick = () => fileInput.click();
    uploadArea.ondragover = (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = '#a855f7';
        uploadArea.style.background = 'rgba(99, 102, 241, 0.1)';
    };
    uploadArea.ondragleave = () => {
        uploadArea.style.borderColor = 'rgba(100, 108, 255, 0.4)';
        uploadArea.style.background = 'transparent';
    };
    uploadArea.ondrop = (e) => {
        e.preventDefault();
        uploadArea.style.borderColor = 'rgba(100, 108, 255, 0.4)';
        uploadArea.style.background = 'transparent';
        const files = e.dataTransfer.files;
        handleFiles(files);
    };
    fileInput.onchange = (e) => handleFiles(e.target.files);
    
    // Load saved playlist on startup
    loadPlaylistFromStorage();
    updateSongCount();
    
    // Set initial album art
    albumArtDisplay.textContent = '🎵';
</script>
</body>
</html>
