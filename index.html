<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Auditline – Internal audit management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#edf1f4;--surf:#fff;--ink:#14202b;--mute:#5c6b78;--line:#dbe2e8;--brand:#0f5c63;--soft:#d9eded;--on:#fff;
--crit:#b3261e;--high:#d9731a;--med:#b8920f;--low:#2f8a63;--shadow:0 1px 2px rgba(20,32,43,.06),0 6px 20px -8px rgba(20,32,43,.12)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0d1418;--surf:#151f25;--ink:#e6edf1;--mute:#93a3ae;--line:#26343d;--brand:#4fb3ba;--soft:#173a3e;--on:#071418;
--crit:#ff7b72;--high:#f0a050;--med:#e3c14d;--low:#5fcf9d;--shadow:0 1px 2px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1418;--surf:#151f25;--ink:#e6edf1;--mute:#93a3ae;--line:#26343d;--brand:#4fb3ba;--soft:#173a3e;--on:#071418;--crit:#ff7b72;--high:#f0a050;--med:#e3c14d;--low:#5fcf9d;--shadow:0 1px 2px rgba(0,0,0,.4)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
aside{background:var(--surf);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font:700 20px "Bricolage Grotesque",sans-serif}
.logo i{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center}
.logo i::after{content:"";width:10px;height:10px;border:2.5px solid var(--on);border-radius:50%;border-right-color:transparent;transform:rotate(-30deg)}
nav a{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:10px;color:var(--mute);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}
nav a.on{background:var(--soft);color:var(--brand);font-weight:600}
nav small{background:var(--bg);border-radius:20px;padding:0 8px;font-size:12px;color:var(--mute)}
.spacer{flex:1}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--mute)}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1180px;width:100%}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.head h1{font-size:28px}.head p{margin:2px 0 0;color:var(--mute)}
.btn{background:var(--brand);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--surf);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--crit);border:1px solid var(--line)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:18px}
.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 34px/1.1 "Bricolage Grotesque",sans-serif}
.kpi span{color:var(--mute);font-size:13px}
.kpi.warn b{color:var(--crit)}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
.card h2{font-size:17px;margin-bottom:14px}
.tl{overflow-x:auto}
.tl-in{min-width:640px;position:relative}
.months{display:grid;grid-template-columns:repeat(12,1fr);font-size:12px;color:var(--mute);border-bottom:1px solid var(--line);padding-bottom:6px;margin-left:150px}
.row{display:flex;align-items:center;height:34px}
.row .lbl{width:150px;flex:none;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:10px}
.track{position:relative;flex:1;height:100%;background:repeating-linear-gradient(90deg,transparent 0 calc(8.333% - 1px),var(--line) calc(8.333% - 1px) 8.333%)}
.bar{position:absolute;top:8px;height:18px;border-radius:9px;background:var(--brand);overflow:hidden;cursor:pointer;border:0;padding:0}
.bar span{position:absolute;inset:0 auto 0 0;background:rgba(255,255,255,.28)}
.bar.Planned{background:var(--mute)}.bar.Reporting{background:var(--high)}.bar.Closed{background:var(--low)}
.today{position:absolute;top:22px;bottom:0;width:2px;background:var(--crit);margin-left:150px}
.today::before{content:"Today";position:absolute;top:-18px;left:-14px;font-size:11px;color:var(--crit)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:13px;color:var(--mute);margin-top:12px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.Critical{color:var(--crit)}.High{color:var(--high)}.Medium{color:var(--med)}.Low{color:var(--low)}
.list{display:flex;flex-direction:column}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.item:first-child{border-top:0}
.item small{color:var(--mute);display:block}
.over{color:var(--crit);font-weight:600}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
input,select{background:var(--surf);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%}
.tools input{max-width:260px}
.chip{background:var(--surf);border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--mute)}
.chip.on{background:var(--brand);color:var(--on);border-color:var(--brand)}
.tbl{overflow-x:auto;padding:0}
table{border-collapse:collapse;width:100%;min-width:640px}
th{text-align:left;font-weight:600;font-size:13px;color:var(--mute);padding:12px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--bg)}
.prog{height:6px;background:var(--bg);border-radius:6px;min-width:90px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand)}
.stat{border:0;background:var(--bg);border-radius:20px;padding:3px 12px;font-size:13px}
.empty{padding:40px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surf);color:var(--ink);padding:24px;width:min(480px,94vw);box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(10,18,24,.55)}
dialog h2{margin-bottom:14px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute)}
.f .w{grid-column:1/-1}
.acts{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:860px){
.app{grid-template-columns:1fr}
aside{position:sticky;height:auto;flex-direction:row;align-items:center;padding:10px 12px;z-index:5;overflow-x:auto;top:env(safe-area-inset-top,0px)}
.logo{padding:0 8px 0 0}.logo span,.spacer,.ghost{display:none}
nav{display:flex;gap:4px}nav small{display:none}
.grid2{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<aside>
  <div class="logo"><i></i><span>Auditline</span></div>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="ghost" id="reset">Reset sample data</button>
</aside>
<main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>

<script>
(function(){
var KEY="auditline-v1",SEV=["Critical","High","Medium","Low"],EST=["Planned","Fieldwork","Reporting","Closed"],FST=["Open","In progress","Closed"];
var seed=function(){return{
eng:[
{id:1,name:"Procure-to-pay controls",area:"Finance",lead:"Mara Keller",status:"Closed",start:"2026-01-12",end:"2026-03-20",progress:100},
{id:2,name:"Access management review",area:"IT security",lead:"Jonas Weber",status:"Closed",start:"2026-02-16",end:"2026-05-08",progress:100},
{id:3,name:"Third-party risk",area:"Procurement",lead:"Mara Keller",status:"Reporting",start:"2026-05-04",end:"2026-08-28",progress:88},
{id:4,name:"Data privacy compliance",area:"Legal",lead:"Lea Brunner",status:"Fieldwork",start:"2026-07-06",end:"2026-12-11",progress:64},
{id:5,name:"Payroll and benefits",area:"HR",lead:"Jonas Weber",status:"Fieldwork",start:"2026-09-14",end:"2027-01-29",progress:35},
{id:6,name:"Business continuity",area:"Operations",lead:"Lea Brunner",status:"Planned",start:"2026-11-30",end:"2027-02-26",progress:5}],
fnd:[
{id:1,title:"Duplicate vendor records bypass approval limits",eng:1,sev:"High",owner:"Finance ops",due:"2026-06-30",status:"Closed"},
{id:2,title:"Leavers keep system access beyond 5 days",eng:2,sev:"Critical",owner:"IT service desk",due:"2026-07-31",status:"In progress"},
{id:3,title:"No exit clause review for critical suppliers",eng:3,sev:"Medium",owner:"Procurement",due:"2026-11-15",status:"Open"},
{id:4,title:"Data subject requests exceed 30-day limit",eng:4,sev:"High",owner:"Privacy office",due:"2026-12-18",status:"Open"},
{id:5,title:"Privileged accounts lack quarterly recertification",eng:2,sev:"High",owner:"IT security",due:"2026-12-05",status:"In progress"},
{id:6,title:"Overtime approvals not retained",eng:5,sev:"Low",owner:"HR payroll",due:"2027-01-15",status:"Open"},
{id:7,title:"Supplier scorecards updated irregularly",eng:3,sev:"Low",owner:"Procurement",due:"2026-10-31",status:"Closed"}]};};
var S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.eng)S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s,r){return(r||document).querySelector(s)}
function esc(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function d(s){return new Date(s+"T00:00:00")}
var TODAY=new Date();TODAY.setHours(0,0,0,0);
function fmt(s){return d(s).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function overdue(f){return f.status!=="Closed"&&d(f.due)<TODAY}
function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove("show")},1800)}
function engName(id){var e=S.eng.filter(function(x){return x.id==id})[0];return e?e.name:"Unassigned"}
function colorVar(s){return"var(--"+{Critical:"crit",High:"high",Medium:"med",Low:"low"}[s]+")"}
var view="dashboard",filt={sev:"All",q:"",hide:true};
var VIEWS={dashboard:"Dashboard",engagements:"Engagements",findings:"Findings"};

function nav(){
  var open=S.fnd.filter(function(f){return f.status!=="Closed"}).length;
  $("#nav").innerHTML=Object.keys(VIEWS).map(function(k){
    var n=k==="engagements"?S.eng.length:k==="findings"?open:"";
    return'<a href="#'+k+'" class="'+(k===view?"on":"")+'">'+VIEWS[k]+(n!==""?"<small>"+n+"</small>":"")+"</a>"}).join("");
}

function dash(){
  var open=S.fnd.filter(function(f){return f.status!=="Closed"}),od=S.fnd.filter(overdue);
  var act=S.eng.filter(function(e){return e.status==="Fieldwork"||e.status==="Reporting"});
  var avg=Math.round(S.eng.reduce(function(a,e){return a+e.progress},0)/Math.max(1,S.eng.length));
  var Y=TODAY.getFullYear(),y0=new Date(Y,0,1),y1=new Date(Y+1,0,1),span=y1-y0;
  var pos=function(s){return Math.max(0,Math.min(100,(d(s)-y0)/span*100))};
  var months=["J","F","M","A","M","J","J","A","S","O","N","D"].map(function(m){return"<span>"+m+"</span>"}).join("");
  var rows=S.eng.map(function(e){var l=pos(e.start),r=pos(e.end);
    return'<div class="row"><div class="lbl" title="'+esc(e.name)+'">'+esc(e.name)+'</div><div class="track"><button class="bar '+e.status+'" data-e="'+e.id+'" style="left:'+l+'%;width:'+Math.max(2,r-l)+'%" title="'+esc(e.status+" · "+e.progress+"%")+'" aria-label="'+esc(e.name)+', '+e.status+', '+e.progress+' percent"><span style="width:'+e.progress+'%"></span></button></div></div>'}).join("");
  var tp=(TODAY-y0)/span*100;
  var counts=SEV.map(function(s){return S.fnd.filter(function(f){return f.sev===s&&f.status!=="Closed"}).length});
  var tot=counts.reduce(function(a,b){return a+b},0),C=2*Math.PI*42,off=0;
  var arcs=counts.map(function(c,i){if(!c)return"";var len=c/tot*C,s='<circle r="42" cx="60" cy="60" fill="none" stroke="'+colorVar(SEV[i])+'" stroke-width="14" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'" transform="rotate(-90 60 60)"/>';off+=len;return s}).join("");
  var soon=open.slice().sort(function(a,b){return d(a.due)-d(b.due)}).slice(0,5).map(function(f){
    return'<div class="item"><div>'+esc(f.title)+'<small>'+esc(f.owner)+' · <span class="'+(overdue(f)?"over":"")+'">'+(overdue(f)?"Overdue since ":"Due ")+fmt(f.due)+'</span></small></div><span class="pill '+f.sev+'">'+f.sev+'</span></div>'}).join("")||'<div class="empty">Nothing open. Nice work.</div>';
  return'<div class="head"><div><h1>Dashboard</h1><p>Where the audit plan and its findings stand today.</p></div><button class="btn" data-new="eng">New engagement</button></div>'+
  '<div class="kpis"><div class="card kpi"><b>'+act.length+'</b><span>Active engagements</span></div><div class="card kpi"><b>'+open.length+'</b><span>Open findings</span></div><div class="card kpi '+(od.length?"warn":"")+'"><b>'+od.length+'</b><span>Overdue actions</span></div><div class="card kpi"><b>'+avg+'%</b><span>Average completion</span></div></div>'+
  '<div class="card"><h2>Audit plan '+Y+'</h2><div class="tl"><div class="tl-in"><div class="months">'+months+'</div>'+rows+'<div class="today" style="left:calc((100% - 150px)*'+(tp/100)+')"></div></div></div>'+
  '<div class="legend"><span><i class="dot" style="background:var(--mute)"></i>Planned</span><span><i class="dot" style="background:var(--brand)"></i>Fieldwork</span><span><i class="dot" style="background:var(--high)"></i>Reporting</span><span><i class="dot" style="background:var(--low)"></i>Closed</span></div></div>'+
  '<div class="grid2"><div class="card"><h2>Next actions due</h2><div class="list">'+soon+'</div></div>'+
  '<div class="card"><h2>Open findings by severity</h2><div class="donut"><svg width="130" height="130" viewBox="0 0 120 120" role="img" aria-label="Open findings by severity">'+(tot?arcs:'<circle r="42" cx="60" cy="60" fill="none" stroke="var(--line)" stroke-width="14"/>')+'<text x="60" y="66" text-anchor="middle" font-size="22" font-weight="700" fill="var(--ink)" font-family="Bricolage Grotesque,sans-serif">'+tot+'</text></svg>'+
  '<div class="legend" style="flex-direction:column;margin:0">'+SEV.map(function(s,i){return'<span><i class="dot" style="background:'+colorVar(s)+'"></i>'+s+" · "+counts[i]+"</span>"}).join("")+'</div></div></div></div>';
}

function engs(){
  var rows=S.eng.map(function(e){var n=S.fnd.filter(function(f){return f.eng==e.id&&f.status!=="Closed"}).length;
    return'<tr class="click" data-e="'+e.id+'" tabindex="0"><td><b>'+esc(e.name)+'</b><div style="color:var(--mute);font-size:13px">'+esc(e.area)+'</div></td><td>'+esc(e.lead)+'</td><td>'+fmt(e.start)+' – '+fmt(e.end)+'</td><td><span class="stat">'+e.status+'</span></td><td><div class="prog"><i style="width:'+e.progress+'%"></i></div><small style="color:var(--mute)">'+e.progress+'%</small></td><td>'+n+' open</td></tr>'}).join("");
  return'<div class="head"><div><h1>Engagements</h1><p>Select a row to edit scope, dates, and progress.</p></div><button class="btn" data-new="eng">New engagement</button></div><div class="card tbl"><table><thead><tr><th>Engagement</th><th>Lead</th><th>Fieldwork window</th><th>Status</th><th>Progress</th><th>Findings</th></tr></thead><tbody>'+(rows||'<tr><td colspan="6" class="empty">No engagements yet. Add your first one.</td></tr>')+'</tbody></table></div>';
}

function fnds(){
  var list=S.fnd.filter(function(f){
    if(filt.sev!=="All"&&f.sev!==filt.sev)return false;
    if(filt.hide&&f.status==="Closed")return false;
    var q=filt.q.toLowerCase();
    return!q||(f.title+f.owner+engName(f.eng)).toLowerCase().indexOf(q)>-1}).sort(function(a,b){return SEV.indexOf(a.sev)-SEV.indexOf(b.sev)||d(a.due)-d(b.due)});
  var rows=list.map(function(f){
    return'<tr class="click" data-f="'+f.id+'" tabindex="0"><td><b>'+esc(f.title)+'</b><div style="color:var(--mute);font-size:13px">'+esc(engName(f.eng))+'</div></td><td><span class="pill '+f.sev+'">'+f.sev+'</span></td><td>'+esc(f.owner)+'</td><td class="'+(overdue(f)?"over":"")+'">'+fmt(f.due)+'</td><td><button class="stat" data-cycle="'+f.id+'" title="Click to change status">'+f.status+'</button></td></tr>'}).join("");
  return'<div class="head"><div><h1>Findings</h1><p>Track every issue from first report to closure.</p></div><button class="btn" data-new="fnd">New finding</button></div>'+
  '<div class="tools"><input id="q" type="search" placeholder="Search findings, owners, engagements" value="'+esc(filt.q)+'" aria-label="Search findings">'+
  ["All"].concat(SEV).map(function(s){return'<button class="chip '+(filt.sev===s?"on":"")+'" data-sev="'+s+'">'+s+"</button>"}).join("")+
  '<button class="chip '+(filt.hide?"on":"")+'" id="hide">Hide closed</button></div>'+
  '<div class="card tbl"><table><thead><tr><th>Finding</th><th>Severity</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>'+(rows||'<tr><td colspan="5" class="empty">No findings match. Clear the filters or add a new finding.</td></tr>')+'</tbody></table></div>';
}

function render(){
  var h=location.hash.slice(1);view=VIEWS[h]?h:"dashboard";
  nav();$("#main").innerHTML=view==="dashboard"?dash():view==="engagements"?engs():fnds();
  var q=$("#q");if(q){q.oninput=function(){filt.q=q.value;var p=q.selectionStart;render();var n=$("#q");n.focus();n.setSelectionRange(p,p)}}
}

function opts(arr,sel){return arr.map(function(o){return'<option'+(o===sel?" selected":"")+'>'+o+"</option>"}).join("")}
function dlg(kind,id){
  var D=$("#dlg"),isE=kind==="eng",it=isE?S.eng.filter(function(x){return x.id==id})[0]:S.fnd.filter(function(x){return x.id==id})[0];
  var iso=function(x){return x.toISOString().slice(0,10)};
  if(!it)it=isE?{name:"",area:"",lead:"",status:"Planned",start:iso(TODAY),end:iso(new Date(TODAY.getTime()+90*864e5)),progress:0}:{title:"",eng:S.eng[0]?S.eng[0].id:"",sev:"Medium",owner:"",due:iso(new Date(TODAY.getTime()+30*864e5)),status:"Open"};
  var isNew=!it.id;
  D.innerHTML=isE?
  '<h2>'+(isNew?"New engagement":"Edit engagement")+'</h2><div class="f"><label class="w">Name<input id="a" value="'+esc(it.name)+'"></label><label>Business area<input id="b" value="'+esc(it.area)+'"></label><label>Audit lead<input id="c" value="'+esc(it.lead)+'"></label><label>Start<input id="s" type="date" value="'+it.start+'"></label><label>End<input id="e" type="date" value="'+it.end+'"></label><label>Status<select id="t">'+opts(EST,it.status)+'</select></label><label>Progress: <span id="pv">'+it.progress+'%</span><input id="p" type="range" min="0" max="100" value="'+it.progress+'"></label></div>':
  '<h2>'+(isNew?"New finding":"Edit finding")+'</h2><div class="f"><label class="w">Title<input id="a" value="'+esc(it.title)+'"></label><label class="w">Engagement<select id="g">'+S.eng.map(function(e){return'<option value="'+e.id+'"'+(e.id==it.eng?" selected":"")+'>'+esc(e.name)+"</option>"}).join("")+'</select></label><label>Severity<select id="v">'+opts(SEV,it.sev)+'</select></label><label>Status<select id="t">'+opts(FST,it.status)+'</select></label><label>Action owner<input id="o" value="'+esc(it.owner)+'"></label><label>Due date<input id="u" type="date" value="'+it.due+'"></label></div>';
  D.innerHTML+='<div class="acts">'+(isNew?"":'<button class="btn danger" id="del">Delete</button>')+'<button class="btn sec" id="x">Cancel</button><button class="btn" id="ok">Save '+(isE?"engagement":"finding")+'</button></div>';
  var p=$("#p",D);if(p)p.oninput=function(){$("#pv",D).textContent=p.value+"%"};
  $("#x",D).onclick=function(){D.close()};
  var del=$("#del",D);if(del)del.onclick=function(){
    if(isE){S.eng=S.eng.filter(function(x){return x.id!==it.id});S.fnd.forEach(function(f){if(f.eng==it.id)f.eng=""})}else S.fnd=S.fnd.filter(function(x){return x.id!==it.id});
    save();D.close();render();toast("Deleted")};
  $("#ok",D).onclick=function(){
    var a=$("#a",D).value.trim();if(!a){$("#a",D).focus();toast("Add a name first");return}
    if(isE){it.name=a;it.area=$("#b",D).value.trim();it.lead=$("#c",D).value.trim();it.start=$("#s",D).value;it.end=$("#e",D).value;it.status=$("#t",D).value;it.progress=+$("#p",D).value;
      if(it.end<it.start){toast("End date must be after start");return}}
    else{it.title=a;it.eng=$("#g",D).value;it.sev=$("#v",D).value;it.status=$("#t",D).value;it.owner=$("#o",D).value.trim();it.due=$("#u",D).value}
    if(isNew){it.id=Date.now();(isE?S.eng:S.fnd).push(it)}
    save();D.close();render();toast("Saved")};
  D.showModal();$("#a",D).focus();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-new],[data-e],[data-f],[data-cycle],[data-sev],#hide");if(!t)return;
  if(t.dataset.cycle){ev.stopPropagation();var f=S.fnd.filter(function(x){return x.id==t.dataset.cycle})[0];f.status=FST[(FST.indexOf(f.status)+1)%3];save();render();return}
  if(t.dataset.new)dlg(t.dataset.new);
  else if(t.dataset.e)dlg("eng",t.dataset.e);
  else if(t.dataset.f)dlg("fnd",t.dataset.f);
  else if(t.dataset.sev){filt.sev=t.dataset.sev;render()}
  else if(t.id==="hide"){filt.hide=!filt.hide;render()}
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.matches("tr.click"))ev.target.click()});
$("#reset").onclick=function(){if(confirm("Replace everything with the sample data?")){S=seed();save();render();toast("Sample data restored")}};
window.addEventListener("hashchange",render);
render();
})();
</script>
</body>
</html>
